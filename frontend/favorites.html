<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorite Comics — Elder's Veil</title>
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="container">
      
      <div class="profile-grid-tabs">
        <a href="/dashboard.html" class="tab-btn"><i class="fas fa-th-large"></i> Dashboard Overview</a>
        <a href="/bookmarks.html" class="tab-btn"><i class="fas fa-bookmark"></i> Bookmarks</a>
        <a href="/favorites.html" class="tab-btn active"><i class="fas fa-heart"></i> Favorites</a>
        <a href="/history.html" class="tab-btn"><i class="fas fa-history"></i> History</a>
        <a href="/profile.html" class="tab-btn"><i class="fas fa-user-cog"></i> Account Settings</a>
      </div>

      <div id="favorites-grid"></div>

    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar('');
      renderFooter();

      if (!Auth.isLoggedIn()) {
        window.location.href = '/login.html';
        return;
      }

      const container = document.getElementById('favorites-grid');
      try {
        const res = await API.get('/users/me/favorites');
        const favorites = res.favorites || [];

        if (favorites.length === 0) {
          container.innerHTML = `
            <div style="text-align:center; padding:4rem 1rem;">
              <i class="far fa-heart" style="font-size:3rem; color:var(--text-muted); margin-bottom:1rem;"></i>
              <h3>Your Favorites List is Empty</h3>
              <p style="color:var(--text-secondary); margin-top:0.5rem;">Explore comics and click 'Favorite' to store your top picks here.</p>
            </div>
          `;
        } else {
          container.innerHTML = `<div class="comic-grid">${favorites.map(renderComicCard).join('')}</div>`;
        }
      } catch (err) {
        container.innerHTML = `<p style="color:var(--accent-pink); text-align:center;">Failed to load favorites: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
