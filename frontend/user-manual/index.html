<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elder's Veil — User Manual</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg-primary:#0b0b0f;--bg-secondary:#15151d;--bg-card:#1b1b24;--border:#2a2a35;
  --text:#ffffff;--text-secondary:#a8a8b3;--accent:#8b5cf6;--accent2:#a855f7;
  --success:#22c55e;--warn:#f59e0b;--err:#ef4444;
  --radius:12px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
:root:not([data-theme="light"]){}
:root[data-theme="light"]{
  --bg-primary:#f7f6fb;--bg-secondary:#ffffff;--bg-card:#ffffff;--border:#e4e1ee;
  --text:#17141f;--text-secondary:#615c72;--accent:#7c3aed;--accent2:#9333ea;
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg-primary);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;transition:background .2s,color .2s}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* HEADER */
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 12px;background:rgba(11,11,15,.85);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
:root[data-theme="light"] header{background:rgba(255,255,255,.85)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:16px}
.brand small{display:block;font-weight:500;color:var(--text-secondary);font-size:11px}
.searchbox{flex:1;max-width:520px;margin:0 auto;position:relative}
.searchbox input{width:100%;background:var(--bg-card);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:10px 40px 10px 14px;font-size:14px}
.searchbox kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-secondary);
  border:1px solid var(--border);border-radius:5px;padding:2px 5px}
.hbtn{background:var(--bg-card);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 12px;
  font-size:13px;cursor:pointer;white-space:nowrap}
.menu-btn,.search-icon-btn{display:none}

/* LAYOUT */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr) 220px;gap:0;max-width:1400px;margin:0 auto}
nav.sidebar{padding:22px 14px;border-right:1px solid var(--border);position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.progress-wrap{margin-bottom:16px;padding:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)}
.progress-wrap .label{font-size:12px;color:var(--text-secondary);margin-bottom:6px;display:flex;justify-content:space-between}
.bar{height:6px;border-radius:4px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.cat{margin-bottom:6px}
.cat-title{font-size:11px;letter-spacing:.06em;color:var(--text-secondary);text-transform:uppercase;padding:12px 10px 6px}
.navitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--text-secondary);cursor:pointer}
.navitem:hover{background:var(--bg-card)}
.navitem.active{background:var(--bg-card);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
.navitem.done .dot{background:var(--success)}

main{padding:32px 40px;min-width:0}
.crumb{font-size:12.5px;color:var(--text-secondary);margin-bottom:14px}
.crumb b{color:var(--text)}
h1.pagetitle{font-size:30px;margin:0 0 8px;letter-spacing:-.01em}
.meta-row{display:flex;gap:14px;color:var(--text-secondary);font-size:12.5px;margin-bottom:26px;flex-wrap:wrap}
.desc{color:var(--text-secondary);font-size:15.5px;margin-bottom:6px}
.content h2{font-size:20px;margin:32px 0 12px;scroll-margin-top:70px}
.content h2:first-child{margin-top:0}
.content p{line-height:1.7;color:var(--text-secondary);font-size:15px}
.box{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:16px 0;font-size:14.5px}
.box b{display:block;margin-bottom:4px}
.box.tip{background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.3)}
.box.tip b{color:var(--accent2)}
.box.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.35)}
.box.warn b{color:var(--warn)}
.box.success{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.35)}
.box.success b{color:var(--success)}
.box.err{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.35)}
.box.err b{color:var(--err)}
.steps{counter-reset:s;margin:18px 0}
.step{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--border)}
.step:last-child{border-bottom:none}
.step .n{counter-increment:s;flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--bg-card);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--accent2)}
.step .t{font-weight:600;font-size:14.5px;margin-bottom:2px}
.step .d{color:var(--text-secondary);font-size:14px;line-height:1.6}
ul.plain{color:var(--text-secondary);font-size:14.5px;line-height:1.8;padding-left:20px}
.shot{border:1px dashed var(--border);border-radius:var(--radius);padding:34px 16px;text-align:center;color:var(--text-secondary);
  font-size:13.5px;background:var(--bg-card);margin:16px 0}
.faq details{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:var(--bg-card)}
.faq summary{cursor:pointer;font-weight:600;font-size:14.5px}
.faq p{margin:10px 0 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--border)}
.pager a{flex:1;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px}
.pager a:hover{background:var(--bg-card)}
.pager .lbl{color:var(--text-secondary);font-size:11px;text-transform:uppercase}
.pager .r{text-align:right}
.markdone{margin-top:26px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;width:fit-content;color:var(--text-secondary)}
.markdone.on{color:var(--success);border-color:rgba(34,197,94,.4)}

/* TOC */
.toc{position:sticky;top:64px;height:fit-content;padding:26px 18px;font-size:13px}
.toc .h{color:var(--text-secondary);text-transform:uppercase;font-size:11px;letter-spacing:.06em;margin-bottom:10px}
.toc a{display:block;padding:5px 0;color:var(--text-secondary);border-left:2px solid transparent;padding-left:10px}
.toc a.active{color:var(--accent2);border-color:var(--accent2)}

/* Command palette */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.overlay.show{display:flex}
.palette{width:min(600px,92vw);background:var(--bg-secondary);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.palette input{width:100%;border:none;background:transparent;color:var(--text);font-size:16px;padding:16px 18px;border-bottom:1px solid var(--border)}
.palette input:focus{outline:none}
.presults{max-height:50vh;overflow-y:auto;padding:6px}
.presult{padding:11px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.presult .p{font-size:11.5px;color:var(--text-secondary)}
.presult:hover,.presult.sel{background:var(--bg-card)}

/* mobile drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;display:none}
.scrim.show{display:block}

@media (max-width:560px){
  #backLink{
    display:inline-flex;
    width:auto;
    min-width:40px;
    height:38px;
    padding:7px 10px;
    font-size:0;
  }

  #backLink::before{
    content:"←";
    font-size:20px;
    margin-right:4px;
  }

  #backLink::after{
    content:"Back";
    font-size:13px;
    font-weight:600;
  }
}

/* ===== Responsive polish ===== */
body{overflow-x:hidden}
header{min-height:64px}
.main-content,.content{max-width:860px}
.content img{max-width:100%;height:auto}
button,a,input{font:inherit}

@media (max-width:980px){
  html{scroll-padding-top:64px}
  header{padding:8px 12px;gap:8px;min-height:60px}
  .brand{gap:8px;min-width:0;flex:1}
  .brand>div:last-child{min-width:0}
  .brand div:nth-child(2)>div{overflow:hidden;text-overflow:ellipsis}
  .brand small{font-size:10px}
  .brand .mark{width:34px;height:34px;flex:0 0 34px}
  .hbtn{min-width:38px;min-height:38px;padding:8px 10px;border-radius:10px}
  .menu-btn,.search-icon-btn{display:inline-flex;flex:0 0 auto}
  #themeBtn{flex:0 0 auto}
  #backLink{display:none}
  .shell{display:block;width:100%;}
  nav.sidebar{width:min(88vw,330px);max-width:none;padding:78px 14px 24px;box-shadow:18px 0 50px rgba(0,0,0,.35);overflow-y:auto;overscroll-behavior:contain}
  main{width:100%;padding:22px 16px 72px}
  .crumb{margin-bottom:12px}
  h1.pagetitle{font-size:clamp(22px,7vw,28px);line-height:1.18}
  .desc{font-size:15px;line-height:1.55}
  .meta-row{gap:8px;margin-bottom:22px}
  .content h2{font-size:19px;line-height:1.3;margin-top:28px}
  .content p{font-size:15px;line-height:1.72}
  .box{font-size:14px;padding:13px 14px}
  .steps{margin:14px 0}
  .step{gap:10px;padding:12px 0;align-items:flex-start}
  .step .n{width:28px;height:28px;flex:0 0 28px}
  .step .t{font-size:14px;line-height:1.4}
  .step .d{font-size:13.5px;line-height:1.6}
  ul.plain{font-size:14px;line-height:1.75;padding-left:20px}
  .shot{padding:26px 14px;line-height:1.5}
  .pager{flex-direction:column;margin-top:34px}
  .pager a{width:100%;}
  .pager .r{text-align:left}
  .markdone{width:100%;justify-content:center;min-height:44px}
  .overlay{padding:8vh 12px 20px}
  .palette{width:100%;max-height:80vh}
  .palette input{font-size:16px;padding:15px}
  .presults{max-height:62vh}
}

@media (max-width:560px){
  header{gap:6px;padding-left:10px;padding-right:10px}
  .brand{gap:7px}
  .brand .mark{width:32px;height:32px;flex-basis:32px;font-size:14px}
  .brand small{display:none}
  .brand div:nth-child(2)>div{font-size:14px}
  .hbtn{width:38px;height:38px;padding:7px;display:inline-flex;align-items:center;justify-content:center}
  main{padding:18px 13px 64px}
  .meta-row{font-size:12px}
  .content h2{font-size:18px}
  .content p{font-size:14.5px}
  .box{border-radius:10px}
  .faq details{padding:11px 12px}
  .faq summary{font-size:14px;line-height:1.45}
}

@media (max-width:380px){
  header{gap:4px}
  .brand .mark{display:none}
  .brand div:nth-child(2)>div{font-size:13px}
  .hbtn{width:36px;height:36px;min-width:36px}
  main{padding-left:11px;padding-right:11px}
}

@media (min-width:981px) and (max-width:1150px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .toc{display:none}
  main{padding-left:30px;padding-right:30px}
}

/* Better touch behavior */
@media (hover:none){
  .navitem,.hbtn,.pager a,.markdone,.faq summary{touch-action:manipulation}
  .navitem{padding-top:10px;padding-bottom:10px}
}

</style>
</head>
<body>

<header>
  <button class="hbtn menu-btn" id="menuBtn" aria-label="Open manual navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
  <div class="brand"><div class="mark">👁</div><div><div>Elder's Veil</div><small>User Manual</small></div></div>
  <div class="searchbox"><input id="searchInput" placeholder="Search the Elder's Veil manual..."><kbd>Ctrl K</kbd></div>
  <button class="hbtn search-icon-btn" id="searchIconBtn" aria-label="Search manual">🔍</button>
  <button class="hbtn" id="themeBtn" aria-label="Toggle theme">🌙</button>
  <a class="hbtn" href="../index.html" id="backLink">← Back to Elder's Veil</a>
</header>
<div class="scrim" id="scrim"></div>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="progress-wrap"><div class="label"><span>Your progress</span><span id="progPct">0%</span></div>
      <div class="bar"><i id="progBar" style="width:0%"></i></div></div>
    <div id="navTree"></div>
  </nav>

  <main id="mainArea"></main>

  <aside class="toc" id="tocArea"></aside>
</div>

<div class="overlay" id="overlay">
  <div class="palette">
    <input id="paletteInput" placeholder="Search documentation or jump to a section...">
    <div class="presults" id="paletteResults"></div>
  </div>
</div>

/* ============ RENDER ENGINE ============ */
const flat = [];
DOCS.forEach(c=>c.pages.forEach(p=>flat.push({cat:c,page:p})));
let current = flat[0];

function saveTheme(t){localStorage.setItem('ev_theme',t);document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').textContent = t==='light' ? '☀️' : '🌙';}
saveTheme(localStorage.getItem('ev_theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark'));
document.getElementById('themeBtn').onclick=()=>saveTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');

function getDone(){try{return JSON.parse(localStorage.getItem('ev_done')||'{}')}catch(e){return {}}}
function setDone(id,val){const d=getDone();if(val)d[id]=true;else delete d[id];localStorage.setItem('ev_done',JSON.stringify(d));renderProgress();renderNav();}
function renderProgress(){const d=getDone();const pct=Math.round(100*Object.keys(d).length/flat.length);
  document.getElementById('progPct').textContent=pct+'%';document.getElementById('progBar').style.width=pct+'%';}

function renderNav(){
  const done=getDone();
  document.getElementById('navTree').innerHTML = DOCS.map(c=>`
    <div class="cat"><div class="cat-title">${c.title}</div>
    ${c.pages.map(p=>`<div class="navitem ${p.id===current.page.id?'active':''} ${done[p.id]?'done':''}" data-cat="${c.id}" data-page="${p.id}">
      <span class="dot"></span>${p.title}</div>`).join('')}
    </div>`).join('');
  document.querySelectorAll('.navitem').forEach(el=>el.onclick=()=>{go(el.dataset.cat,el.dataset.page);closeSidebar();});
}

function block(b){
  if(b.h) return `<h2 id="${slug(b.h)}">${b.h}</h2>`;
  if(b.p) return `<p>${b.p}</p>`;
  if(b.ul) return `<ul class="plain">${b.ul.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(b.tip) return `<div class="box tip"><b>💡 ${b.tip}</b>${b.t}</div>`;
  if(b.box) return `<div class="box ${b.box}"><b>${b.box==='warn'?'⚠ Important':b.box==='success'?'✓ Success':b.box==='err'?'✕ Troubleshooting':b.box}</b>${b.d}</div>`;
  if(b.steps) return `<div class="steps">${b.steps.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div><div class="t">${s[0]}</div><div class="d">${s[1]||''}</div></div></div>`).join('')}</div>`;
  if(b.shot) return `<div class="shot">🖼️ Screenshot coming soon<br><small>${b.shot}</small></div>`;
  if(b.faq) return `<div class="faq">${b.faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div>`;
  return '';
}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}

function render(){
  const {cat,page}=current;
  const idx=flat.findIndex(f=>f.page.id===page.id);
  const prev=flat[idx-1], next=flat[idx+1];
  const done=getDone()[page.id];
  document.getElementById('mainArea').innerHTML = `
    <div class="crumb">User Manual / ${cat.title} / <b>${page.title}</b></div>
    <h1 class="pagetitle">${page.title}</h1>
    <div class="desc">${page.desc}</div>
    <div class="meta-row"><span>⏱ ${page.time} read</span><span>Updated Sep 2026</span></div>
    <div class="content">${page.content.map(block).join('')}</div>
    <div class="markdone ${done?'on':''}" id="markDone">${done? '✓ Marked as completed' : '○ Mark as completed'}</div>
    <div class="pager">
      ${prev?`<a href="#" data-nav="${prev.cat.id}|${prev.page.id}"><div class="lbl">← Previous</div>${prev.page.title}</a>`:'<div></div>'}
      ${next?`<a href="#" class="r" data-nav="${next.cat.id}|${next.page.id}"><div class="lbl">Next →</div>${next.page.title}</a>`:'<div></div>'}
    </div>`;
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=(e)=>{e.preventDefault();const[c,p]=el.dataset.nav.split('|');go(c,p);window.scrollTo(0,0);});
  document.getElementById('markDone').onclick=()=>setDone(page.id, !getDone()[page.id]);

  const heads = page.content.filter(b=>b.h);
  document.getElementById('tocArea').innerHTML = heads.length? `<div class="h">On this page</div>${heads.map(h=>`<a href="#${slug(h.h)}">${h.h}</a>`).join('')}` : '';
  window.scrollTo(0,0);
  renderNav(); renderProgress();
}

function go(catId,pageId){
  const c = DOCS.find(x=>x.id===catId); const p = c.pages.find(x=>x.id===pageId);
  current={cat:c,page:p}; location.hash = catId+'/'+pageId; render();
}

/* mobile sidebar */
const sidebar=document.getElementById('sidebar'), scrim=document.getElementById('scrim');
function openSidebar(){sidebar.classList.add('open');scrim.classList.add('show');document.getElementById('menuBtn').setAttribute('aria-expanded','true');document.body.style.overflow='hidden'}
function closeSidebar(){sidebar.classList.remove('open');scrim.classList.remove('show');document.getElementById('menuBtn').setAttribute('aria-expanded','false');document.body.style.overflow=''}
document.getElementById('menuBtn').onclick=openSidebar;
scrim.onclick=closeSidebar;

/* search + command palette */
const overlay=document.getElementById('overlay'), paletteInput=document.getElementById('paletteInput'), paletteResults=document.getElementById('paletteResults');
function openPalette(){overlay.classList.add('show');paletteInput.value='';paletteInput.focus();searchRun('')}
function closePalette(){overlay.classList.remove('show')}
document.getElementById('searchInput').onclick=openPalette;
document.getElementById('searchIconBtn').onclick=openPalette;
overlay.onclick=(e)=>{if(e.target===overlay)closePalette()};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();overlay.classList.contains('show')?closePalette():openPalette();}
  if(e.key==='Escape')closePalette();
});
function searchRun(q){
  q=q.toLowerCase().trim();
  let matches=[];
  flat.forEach(f=>{
    const hay=(f.page.title+' '+f.page.desc+' '+JSON.stringify(f.page.content)).toLowerCase();
    if(!q || hay.includes(q)) matches.push(f);
  });
  matches=matches.slice(0,20);
  paletteResults.innerHTML = matches.length? matches.map(m=>`<div class="presult" data-cat="${m.cat.id}" data-page="${m.page.id}">${m.page.title}<div class="p">${m.cat.title}</div></div>`).join('')
    : `<div class="presult" style="color:var(--text-secondary)">No results</div>`;
  document.querySelectorAll('.presult[data-page]').forEach(el=>el.onclick=()=>{go(el.dataset.cat,el.dataset.page);closePalette();});
}
paletteInput.addEventListener('input',()=>searchRun(paletteInput.value));

/* scroll-spy for TOC */
window.addEventListener('scroll',()=>{
  const links=[...document.querySelectorAll('.toc a')];
  if(!links.length)return;
  let activeIdx=0;
  document.querySelectorAll('.content h2').forEach((h,i)=>{ if(h.getBoundingClientRect().top < 100) activeIdx=i; });
  links.forEach((l,i)=>l.classList.toggle('active', i===activeIdx));
},{passive:true});

/* init from hash */
(function init(){
  const h=(location.hash||'').replace('#','');
  if(h.includes('/')){
    const[c,p]=h.split('/'); const cat=DOCS.find(x=>x.id===c);
    if(cat){const pg=cat.pages.find(x=>x.id===p); if(pg) current={cat,page:pg};}
  }
  render();
})();
</script>
