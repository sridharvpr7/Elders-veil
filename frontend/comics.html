<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comic Catalog — Elder's Veil</title>
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="container">
      <div class="section-title"><i class="fas fa-th-large text-gradient"></i> <span>Explore All Comics</span></div>

      <!-- Filters Toolbar -->
      <div style="background:var(--bg-secondary); border:1px solid var(--glass-border); padding:1.25rem; border-radius:var(--radius-md); margin-bottom:2rem; display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:1rem;">
        <div class="form-group" style="margin:0;">
          <label class="form-label">Search</label>
          <input type="text" id="filter-search" class="form-input" placeholder="Keyword..." />
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Genre</label>
          <select id="filter-genre" class="form-select">
            <option value="">All Genres</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Type</label>
          <select id="filter-type" class="form-select">
            <option value="">All Types</option>
            <option value="manga">Manga</option>
            <option value="manhwa">Manhwa</option>
            <option value="manhua">Manhua</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Sort By</label>
          <select id="filter-sort" class="form-select">
            <option value="latest">Latest Updated</option>
            <option value="popular">Most Views</option>
            <option value="rating">Top Rated</option>
            <option value="title">Title A-Z</option>
          </select>
        </div>
      </div>

      <div id="comics-grid"></div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/comics.js"></script>
</body>
</html>
