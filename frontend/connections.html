<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connections — Elder's Veil</title>
<link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="/js/theme.js"></script>
<style>
.connections-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.connection-tabs{display:flex;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap}
.connection-tab{padding:.65rem 1rem;border:1px solid var(--glass-border);border-radius:10px;text-decoration:none;color:var(--text-primary)}
.connection-tab.active{background:var(--primary);color:#fff}
.connection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.connection-card{display:flex;align-items:center;gap:.85rem;padding:1rem;border:1px solid var(--glass-border);border-radius:14px;background:var(--bg-secondary)}
.connection-card img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.connection-card a{color:var(--text-primary);text-decoration:none;font-weight:700}
.empty-connections{text-align:center;padding:3rem 1rem;color:var(--text-muted);border:1px dashed var(--glass-border);border-radius:14px}
</style>
</head>
<body><header id="app-header"></header>
<main><div class="container">
<div class="connections-head"><div><h1 id="page-title">Connections</h1><p id="page-subtitle" style="color:var(--text-muted);margin:.35rem 0 0;"></p></div><a class="btn btn-secondary" href="/profile.html"><i class="fas fa-arrow-left"></i> Profile</a></div>
<div class="connection-tabs"><a id="following-tab" class="connection-tab" href="?type=following">Following</a><a id="followers-tab" class="connection-tab" href="?type=followers">Followers</a></div>
<div id="connections-list">Loading...</div>
</div></main><footer id="app-footer"></footer>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
 renderNavbar('');renderFooter();
 if(!Auth.isLoggedIn()){location.href='/login.html';return;}
 const p=new URLSearchParams(location.search),type=p.get('type')==='followers'?'followers':'following',userId=p.get('userId');
 const isOwn=!userId||userId===((Auth.getUser()||{}).id);
 document.getElementById(type+'-tab').classList.add('active');
 if(type==='following'){
   document.getElementById('page-title').textContent='Following';
   document.getElementById('page-subtitle').textContent=isOwn?'Creators you follow':'Creators this user follows';
 }else{
   document.getElementById('page-title').textContent='Followers';
   document.getElementById('page-subtitle').textContent='Users following this creator';
 }
 try{
   let data;
   if(type==='following' && isOwn) data=await API.get('/engagement/me/following');
   else if(type==='followers' && isOwn) data=await API.get('/engagement/me/followers');
   else if(type==='followers' && userId) data=await API.get('/engagement/creators/'+encodeURIComponent(userId)+'/followers');
   else if(type==='following' && userId) data=await API.get('/engagement/users/'+encodeURIComponent(userId)+'/following');
   else throw new Error('Invalid connection request.');
   const list=type==='following'?(data.following||[]):(data.followers||[]);
   const el=document.getElementById('connections-list');
   if(!list.length){el.innerHTML='<div class="empty-connections"><i class="fas fa-user-friends" style="font-size:2rem;"></i><h3>No '+type+' yet</h3><p>'+ (type==='following'?'Follow a creator to see them here.':'No one is following this creator yet.') +'</p></div>';return;}
   el.innerHTML='<div class="connection-grid">'+list.map(u=>{
      const avatar=u.avatar||'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';
      const href=u.role==='creator'||u.role==='admin'?'/creator.html?id='+encodeURIComponent(u.id):'#';
      return '<div class="connection-card"><img src="'+avatar+'" alt=""><div><a href="'+href+'">'+u.username+'</a><div style="color:var(--text-muted);font-size:.85rem;">'+(u.role==='creator'||u.role==='admin'?'Creator':'Reader')+'</div></div></div>';
   }).join('')+'</div>';
 }catch(e){document.getElementById('connections-list').innerHTML='<div class="empty-connections"><h3>Unable to load</h3><p>'+e.message+'</p></div>';}
});
</script></body></html>
