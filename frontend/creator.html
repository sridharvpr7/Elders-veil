<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="api-base-url" content="https://elders-veil.onrender.com/api"><link rel="manifest" href="manifest.json"><title>Creator — Elder's Veil</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/cards.css"><script src="js/theme.js"></script></head><body><header id="app-header"></header><main><div class="container"><div id="creator-profile"></div><div id="creator-comics"></div></div></main><footer id="app-footer"></footer><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/i18n.js"></script><script src="js/components.js"></script><script src="js/pwa.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{renderNavbar('');renderFooter();const id=new URLSearchParams(location.search).get('id');if(!id)return;try{const r=await API.get('/users/creator/'+encodeURIComponent(id));document.getElementById('creator-profile').innerHTML=`<div class="profile-header"><img class="profile-avatar-xl" src="${r.creator.avatar||'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}"><div class="profile-info"><h1>${r.creator.username}</h1><p>Comic Writer</p><button class="btn btn-primary" id="follow">${r.following?'Following':'Follow Creator'}</button></div></div>`;document.getElementById('creator-comics').innerHTML='<div class="section-title">Published Comics</div><div class="comic-grid">'+(r.comics||[]).map(renderComicCard).join('')+'</div>';document.getElementById('follow').onclick=async()=>{if(!Auth.isLoggedIn())return showToast('Please sign in first.','error');const x=await API.post('/engagement/creators/'+r.creator.id+'/follow',{});document.getElementById('follow').textContent=x.following?'Following':'Follow Creator';}}catch(e){document.getElementById('creator-profile').innerHTML='<p>'+e.message+'</p>'}});</script></body></html>
