<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="api-base-url" content="https://elders-veil.onrender.com/api" />
  <meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>Premium — Elder's Veil</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="js/theme.js"></script></head><body><header id="app-header"></header><main><div class="container"><div class="auth-card" style="max-width:780px;margin:2rem auto;text-align:center"><h1><i class="fas fa-crown"></i> Elder's Veil Premium</h1><p style="color:var(--text-secondary)">Premium is optional. Choose the monthly plan below or ask an administrator to grant premium access.</p><div id="premium-status" style="margin:1.5rem 0"></div><div class="premium-plan-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;text-align:left"><div class="stat-card"><strong>✨ Premium Theme</strong><span>Exclusive gold styling</span></div><div class="stat-card"><strong>🎨 Light/Dark</strong><span>Personal theme control</span></div><div class="stat-card"><strong>🏆 Badge</strong><span>Premium profile state</span></div><div class="stat-card"><strong>🔔 Alerts</strong><span>Premium reminders</span></div></div><button class="btn btn-primary" id="buy-premium"><i class="fas fa-bolt"></i> Buy 1 Month Premium</button><p id="payment-note" style="color:var(--text-muted);font-size:.8rem;margin-top:1rem"></p></div></div></main><footer id="app-footer"></footer><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/i18n.js"></script>
<script src="js/components.js"></script><script src="js/pwa.js"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{renderNavbar('');renderFooter();const u=Auth.getUser();const st=document.getElementById('premium-status');if(!u){st.innerHTML='<p>Please sign in first.</p>';document.getElementById('buy-premium').disabled=true;return;}const active=u.is_premium&&(!u.premium_expires_at||new Date(u.premium_expires_at)>new Date());st.innerHTML=active?`<span class="badge badge-purple">Premium active</span><p style="margin-top:.75rem">Expires ${new Date(u.premium_expires_at).toLocaleString()}</p>`:'<span class="badge badge-pink">Not active</span>';document.getElementById('buy-premium').onclick=async()=>{try{const o=await API.post('/payments/create-order',{});if(!window.Razorpay){throw new Error('Payment checkout is unavailable.');}const rzp=new Razorpay({key:o.keyId,amount:o.order.amount,currency:o.order.currency,name:"Elder's Veil",description:'1 Month Premium',order_id:o.order.id,handler:async(response)=>{const v=await API.post('/payments/verify',response);Auth.saveSession(v.user,Auth.getToken());showToast('Premium activated!','success');setTimeout(()=>location.reload(),700);},prefill:{name:u.username,email:u.email,contact:u.phone||''},theme:{color:'#7c3aed'}});rzp.open();}catch(e){document.getElementById('payment-note').textContent=e.message;showToast(e.message,'error')}}});</script></body></html>
