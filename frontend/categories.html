<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Categories & Genres — Elder's Veil</title>
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="container">
      <div class="section-title"><i class="fas fa-tags text-gradient"></i> <span>Browse Genres</span></div>
      
      <div class="genre-pills" id="categories-list" style="margin-bottom:2.5rem;">
        <a href="/comics.html?genre=Action" class="genre-pill">Action</a>
        <a href="/comics.html?genre=Adventure" class="genre-pill">Adventure</a>
        <a href="/comics.html?genre=Fantasy" class="genre-pill">Fantasy</a>
        <a href="/comics.html?genre=Sci-Fi" class="genre-pill">Sci-Fi</a>
        <a href="/comics.html?genre=Cyberpunk" class="genre-pill">Cyberpunk</a>
        <a href="/comics.html?genre=Mystery" class="genre-pill">Mystery</a>
        <a href="/comics.html?genre=Romance" class="genre-pill">Romance</a>
        <a href="/comics.html?genre=Supernatural" class="genre-pill">Supernatural</a>
      </div>

      <div id="category-comics-grid"></div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar('categories');
      renderFooter();

      const grid = document.getElementById('category-comics-grid');
      try {
        const res = await API.get('/comics?limit=24');
        if (grid) grid.innerHTML = `<div class="comic-grid">${(res.comics || []).map(renderComicCard).join('')}</div>`;
      } catch (err) {}
    });
  </script>
</body>
</html>
