<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Studio — Elder's Veil</title><link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="/js/theme.js"></script></head><body><header id="app-header"></header><main><div class="container"><div class="section-title"><i class="fas fa-pen-nib text-gradient"></i> Creator Studio</div><div class="admin-layout"><aside class="admin-sidebar"><a class="admin-nav-item active" href="/creator/dashboard.html"><i class="fas fa-chart-line"></i> My Comics</a><a class="admin-nav-item" href="/creator/upload.html"><i class="fas fa-cloud-upload-alt"></i> Upload Comic / Chapter</a></aside><section><div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap"><div><h2>Publish your stories</h2><p style="color:var(--text-muted)">Create comics, add chapters, then publish when ready.</p></div><button id="become" class="btn btn-primary">Become a Creator</button></div><div id="creator-list" class="data-table-container">Loading your comics...</div></section></div></div></main><footer id="app-footer"></footer><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{renderNavbar('creator');renderFooter();if(!Auth.isLoggedIn()){location.href='/login.html';return;}const user=Auth.getUser();const b=document.getElementById('become');if(user.role==='creator'||user.role==='admin')b.style.display='none';b.onclick=async()=>{try{const r=await API.post('/users/me/become-creator',{});Auth.saveSession(r.user,Auth.getToken());showToast('Creator mode activated!','success');location.reload()}catch(e){showToast(e.message,'error')}};try{const r=await API.get('/comics?mine=true&limit=100');const el=document.getElementById('creator-list');if(!r.comics?.length){el.innerHTML='<div style="padding:2rem;text-align:center">No comics yet. Use Upload Comic / Chapter to start.</div>';return}el.innerHTML='<table class="data-table"><thead><tr><th>Comic</th><th>Status</th><th>Views</th><th>Chapters</th><th>Action</th></tr></thead><tbody>'+r.comics.map(c=>`<tr><td><strong>${c.title}</strong></td><td>${c.publishStatus||'published'}</td><td>${Number(c.views||0).toLocaleString()}</td><td>${c.chapterCount||0}</td><td>${c.publishStatus==='draft'?`<button class="btn btn-primary btn-sm pub" data-id="${c.id}">Publish</button>`:'<span>Published</span>'}</td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('.pub').forEach(x=>x.onclick=async()=>{try{await API.post('/comics/'+x.dataset.id+'/publish',{});showToast('Comic published!','success');location.reload()}catch(e){showToast(e.message,'error')}})}catch(e){document.getElementById('creator-list').textContent=e.message}});</script></body></html>
