<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Studio — Elder's Veil</title><link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="/js/theme.js"></script></head><body><header id="app-header"></header><main><div class="container"><div class="section-title"><i class="fas fa-pen-nib text-gradient"></i> Creator Studio</div><div class="admin-layout"><aside class="admin-sidebar"><a class="admin-nav-item active" href="/creator/dashboard.html"><i class="fas fa-chart-line"></i> My Comics</a><a class="admin-nav-item" href="/creator/upload.html"><i class="fas fa-cloud-upload-alt"></i> Upload Comic / Chapter</a></aside><section><div class="creator-hero"><div><h2>Creator Studio</h2><p style="color:var(--text-muted)">Upload your comics and chapters. They stay private until an administrator reviews and publishes them.</p></div><a class="btn btn-primary" href="/creator/upload.html"><i class="fas fa-plus"></i> New Submission</a></div><div id="creator-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1rem"></div><div id="creator-list" class="data-table-container">Loading your submissions...</div></section></div></div></main><footer id="app-footer"></footer><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{renderNavbar('creator');renderFooter();if(!Auth.isLoggedIn()){location.href='/login.html';return;}const user=Auth.getUser();if(!user){location.href='/login.html';return;}if(!['creator','admin'].includes(user.role)){location.href='/dashboard.html';return;}try{const [r,cr]=await Promise.all([API.get('/comics?mine=true&limit=100'),API.get('/chapters/mine')]);const el=document.getElementById('creator-list');const comics=r.comics||[];const chapters=cr.chapters||[];const stats=document.getElementById('creator-stats');if(stats){const views=comics.reduce((n,c)=>n+Number(c.views||0),0);stats.innerHTML=[['Comics',comics.length],['Published',comics.filter(c=>c.publishStatus==='published').length],['Pending',comics.filter(c=>c.publishStatus==='pending').length],['Chapters',chapters.length],['Views',views.toLocaleString()]].map(x=>`<div class="auth-card"><strong style="font-size:1.4rem">${x[1]}</strong><div style="color:var(--text-muted)">${x[0]}</div></div>`).join('')}let html='';if(!comics.length){html+='<div style="padding:2rem;text-align:center"><i class="fas fa-feather-alt" style="font-size:2rem"></i><h3>No submissions yet</h3><p style="color:var(--text-muted);margin:.5rem 0 1rem">Your approved submissions will appear publicly after administrator review.</p><a class="btn btn-primary" href="/creator/upload.html">Create Comic</a></div>';}else{html+='<h3 style="margin-bottom:1rem"><i class="fas fa-book"></i> My Comics</h3><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Comic</th><th>Status</th><th>Views</th><th>Chapters</th><th>Admin Note</th><th>Action</th></tr></thead><tbody>'+comics.map(c=>`<tr><td><div style="display:flex;align-items:center;gap:.75rem"><img src="${c.coverImage||'/uploads/covers/default.jpg'}" style="width:42px;height:58px;object-fit:cover;border-radius:6px"><strong>${c.title}</strong></div></td><td><span class="status-chip status-${c.publishStatus||'published'}">${c.publishStatus||'published'}</span></td><td>${Number(c.views||0).toLocaleString()}</td><td>${c.chapterCount||0}</td><td>${c.reviewNote||'—'}</td><td>${c.publishStatus==='rejected'?`<button class="btn btn-secondary btn-sm resubmit" data-id="${c.id}"><i class="fas fa-paper-plane"></i> Resubmit</button>`:''}</td></tr>`).join('')+'</tbody></table></div>';}html+='<h3 style="margin:2rem 0 1rem"><i class="fas fa-list-ol"></i> Chapter Submissions</h3>';html+=chapters.length?'<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Comic</th><th>Chapter</th><th>Pages</th><th>Status</th><th>Admin Note</th><th>Action</th></tr></thead><tbody>'+chapters.map(c=>`<tr><td>${c.comicTitle||'—'}</td><td>Chapter ${c.chapterNumber}: ${c.title||'Untitled'}</td><td>${c.pageCount||c.pages?.length||0}</td><td><span class="status-chip status-${c.publishStatus||'published'}">${c.publishStatus||'published'}</span></td><td>${c.reviewNote||'—'}</td><td>${c.publishStatus==='rejected'?`<button class="btn btn-secondary btn-sm chapter-resubmit" data-id="${c.id}"><i class="fas fa-paper-plane"></i> Resubmit</button>`:''}</td></tr>`).join('')+'</tbody></table></div>':'<p style="color:var(--text-muted)">No chapter submissions yet.</p>';el.innerHTML=html;document.querySelectorAll('.resubmit').forEach(b=>b.onclick=async()=>{try{await API.post('/comics/'+b.dataset.id+'/resubmit',{});showToast('Comic resubmitted for admin review.','success');location.reload()}catch(e){showToast(e.message,'error')}});document.querySelectorAll('.chapter-resubmit').forEach(b=>b.onclick=async()=>{try{await API.post('/chapters/'+b.dataset.id+'/resubmit',{});showToast('Chapter resubmitted for admin review.','success');location.reload()}catch(e){showToast(e.message,'error')}})}catch(e){document.getElementById('creator-list').textContent=e.message}});
</script></body></html>
