<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Analytics — Elder's Veil</title><link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/platform.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><header id="app-header"></header><main><div class="container platform-wrap"><div class="platform-hero"><div><span class="eyebrow">CREATOR STUDIO</span><h1>Advanced Analytics</h1><p>Track readership, views, chapters, ratings and follower growth.</p></div><a class="btn btn-primary" href="/creator/dashboard.html">Creator Studio</a></div><div id="stats" class="platform-grid"></div><div class="platform-card" style="margin-top:1rem"><h2>Event Performance</h2><div id="events"></div></div></div></main><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{renderNavbar('creator');if(!Auth.isLoggedIn()){location.href='/login.html';return;}const r=await API.get('/platform/creator/me/analytics');const vals=[['Comics',r.comics||0],['Chapters',r.chapters||0],['Views',Number(r.views||0).toLocaleString()],['Chapter Views',Number(r.chapter_views||0).toLocaleString()],['Followers',Number(r.followers||0).toLocaleString()],['Average Rating',Number(r.rating||0).toFixed(2)]];document.getElementById('stats').innerHTML=vals.map(x=>`<section class="platform-card"><div class="muted">${x[0]}</div><strong style="font-size:2rem">${x[1]}</strong></section>`).join('');document.getElementById('events').innerHTML=(r.events||[]).map(x=>`<div class="mini-item"><strong>${x.event_type}</strong><span class="muted">${x.count}</span></div>`).join('')||'<p class="muted">Analytics will populate as readers interact with your comics.</p>';});</script></body></html>
