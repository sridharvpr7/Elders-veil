<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Elder's Veil</title>
  <link rel="stylesheet" href="/css/reset.css" /><link rel="stylesheet" href="/css/variables.css" /><link rel="stylesheet" href="/css/theme.css" /><link rel="stylesheet" href="/css/global.css" /><link rel="stylesheet" href="/css/navbar.css" /><link rel="stylesheet" href="/css/auth.css" /><link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" /><script src="/js/theme.js"></script>
</head>
<body>
<header id="app-header"></header>
<main><div class="auth-wrapper"><div class="auth-card">
  <div class="auth-header"><h1 class="auth-title">Forgot Password</h1><p class="auth-subtitle">We'll send a 6-digit reset code to your registered email.</p></div>
  <form id="forgot-form">
    <div class="form-group"><label class="form-label" for="forgot-email">Email Address</label><input type="email" id="forgot-email" class="form-input" required autocomplete="email" placeholder="reader@example.com" /></div>
    <button id="forgot-submit" type="submit" class="btn btn-primary" style="width:100%;margin-top:1rem;"><i class="fas fa-paper-plane"></i> Send Reset OTP</button>
  </form>
  <div class="auth-footer"><a href="/login.html">Back to Sign In</a></div>
</div></div></main>
<footer id="app-footer"></footer>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  renderNavbar(''); renderFooter();
  const form=document.getElementById('forgot-form');
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const email=document.getElementById('forgot-email').value.trim().toLowerCase();
    const button=document.getElementById('forgot-submit'); button.disabled=true;
    try{
      const res=await API.post('/auth/forgot-password',{email});
      sessionStorage.setItem('resetEmail',email);
      showToast(res.message||'If the account exists, a reset code has been sent.', 'success');
      setTimeout(()=>window.location.href='/reset-password.html',600);
    }catch(err){showToast(err.message||'Could not request password reset.','error');}
    finally{button.disabled=false;}
  });
});
</script>
</body></html>
