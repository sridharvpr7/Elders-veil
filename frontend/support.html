<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="api-base-url" content="https://elders-veil.onrender.com/api"><title>Support — Elder's Veil</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/global.css"><script src="js/theme.js"></script></head><body><main><div class="container" style="padding-top:4rem"><div class="auth-card" style="max-width:700px;margin:auto"><h1>Support</h1><form id="f"><input id="s" class="form-input" placeholder="Subject" required><textarea id="m" class="form-textarea" placeholder="Describe the issue" required></textarea><button class="btn btn-primary">Submit Ticket</button></form><div id="list" style="margin-top:2rem"></div></div></div></main><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/pwa.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!Auth.isLoggedIn())return location='login.html';const load=async()=>{const r=await API.get('/users/me/support');document.getElementById('list').innerHTML=(r.tickets||[]).map(t=>`<div class="history-card"><b>${t.subject}</b><p>${t.message}</p><small>Status: ${t.status}${t.admin_reply?' — '+t.admin_reply:''}</small></div>`).join('')||'<p>No tickets yet.</p>'};document.getElementById('f').onsubmit=async e=>{e.preventDefault();await API.post('/users/me/support',{subject:document.getElementById('s').value,message:document.getElementById('m').value});showToast('Ticket submitted.','success');e.target.reset();load()};load()});</script></body></html>
