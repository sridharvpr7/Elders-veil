<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="api-base-url" content="https://elders-veil.onrender.com/api" />
  <meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Elder's Veil</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/global.css"><script src="js/theme.js"></script></head><body><main style="padding:5rem 1rem"><div class="auth-card" style="max-width:480px;margin:auto"><h1>Set New Password</h1><form id="f"><input id="p" class="form-input" type="password" minlength="6" placeholder="New password" required><button class="btn btn-primary" type="submit">Update Password</button></form></div></main><script src="js/api.js"></script><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{const token=new URLSearchParams(location.search).get('token');await API.post('/auth/reset-password',{token,newPassword:document.getElementById('p').value});alert('Password updated.');location='/login.html';}catch(x){alert(x.message)}};</script><script src="js/pwa.js"></script></body></html>
