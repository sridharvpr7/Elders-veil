<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password — Elder's Veil</title><link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/auth.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="/js/theme.js"></script></head><body><header id="app-header"></header><main><div class="auth-wrapper"><div class="auth-card"><div class="auth-header"><h1 class="auth-title">Reset Password</h1><p class="auth-subtitle">Enter your email code, then choose a new password.</p></div><form id="reset-form"><div id="otp-step"><div class="form-group"><label class="form-label">6-Digit Reset Code</label><input id="reset-otp" class="form-input" inputmode="numeric" maxlength="6" pattern="\d{6}" required placeholder="123456"></div><button class="btn btn-primary" style="width:100%">Verify Code</button></div><div id="password-step" style="display:none"><div class="form-group"><label class="form-label">New Password</label><input type="password" id="new-password" class="form-input" minlength="6" required></div><div class="form-group"><label class="form-label">Confirm Password</label><input type="password" id="confirm-password" class="form-input" minlength="6" required></div><button class="btn btn-primary" style="width:100%">Set New Password</button></div></form><div class="auth-footer"><a href="/login.html">Back to Sign In</a></div></div></div></main><footer id="app-footer"></footer><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{renderNavbar('');renderFooter();const email=sessionStorage.getItem('resetEmail')||'';if(!email){location.href='/forgot-password.html';return;}let resetToken='';document.getElementById('reset-form').onsubmit=async e=>{e.preventDefault();try{if(!resetToken){const r=await API.post('/auth/verify-reset-otp',{email,otp:document.getElementById('reset-otp').value.trim()});resetToken=r.resetToken;document.getElementById('otp-step').style.display='none';document.getElementById('password-step').style.display='block';showToast(r.message,'success');return;}const r=await API.post('/auth/reset-password',{email,resetToken,newPassword:document.getElementById('new-password').value,confirmPassword:document.getElementById('confirm-password').value});sessionStorage.removeItem('resetEmail');showToast(r.message,'success');setTimeout(()=>location.href='/login.html',600)}catch(err){showToast(err.message,'error')}}});</script></body></html>
