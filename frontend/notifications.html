<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notifications — Elder's Veil</title>
  <link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>.notifications-page{padding:110px 0 50px}.notifications-shell{max-width:850px;margin:auto}.notifications-top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.notifications-top h1{margin:0}.notifications-sub{color:var(--text-muted);margin:.4rem 0 0}.notifications-actions{display:flex;gap:8px}.notifications-list-page{display:grid;gap:10px}.page-notification{position:relative;display:flex;gap:14px;padding:17px 48px 17px 17px;background:var(--bg-secondary);border:1px solid var(--glass-border);border-radius:15px}.page-notification.unread{border-color:rgba(139,92,246,.45);background:rgba(139,92,246,.06)}.page-notification .notification-icon{width:42px;height:42px;flex-basis:42px}.page-notification h3{margin:0;font-size:.95rem}.page-notification p{margin:5px 0;color:var(--text-secondary);line-height:1.5}.page-notification time{color:var(--text-muted);font-size:.75rem}.page-notification .notification-remove{top:13px;right:13px}.notifications-empty{padding:60px 20px;text-align:center;background:var(--bg-secondary);border:1px dashed var(--glass-border);border-radius:16px;color:var(--text-muted)}.notifications-empty i{font-size:2rem;margin-bottom:10px}.notifications-empty h3{color:var(--text-primary);margin:.2rem 0 .4rem}@media(max-width:600px){.notifications-page{padding-top:90px}.notifications-top{align-items:stretch;flex-direction:column}.notifications-actions{width:100%}.notifications-actions button{flex:1}.page-notification{padding:14px 42px 14px 13px}}
  </style>
</head>
<body><header id="app-header"></header><main class="notifications-page"><div class="container notifications-shell"><div class="notifications-top"><div><h1>Notifications</h1><p class="notifications-sub" id="notification-summary">Stay up to date with Elder's Veil.</p></div><div class="notifications-actions"><button class="btn btn-secondary" id="mark-all"><i class="fas fa-check-double"></i> Mark all read</button><button class="btn btn-secondary" id="clear-all"><i class="fas fa-trash"></i> Clear all</button></div></div><section class="notifications-list-page" id="notifications-list"></section></div></main><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/theme.js"></script><script src="/js/components.js"></script><script src="/js/notifications.js"></script></body></html>
