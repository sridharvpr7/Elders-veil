<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — Elder's Veil</title><link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="/js/theme.js"></script></head><body><header id="app-header"></header><main><div class="container"><div class="section-title"><i class="fas fa-bell text-gradient"></i> Notifications</div><div id="notifications"></div><div class="auth-card" style="margin-top:2rem"><h3>Notification Preferences</h3><label><input type="checkbox" id="wa-comic"> New comic WhatsApp</label><br><label><input type="checkbox" id="wa-chapter"> New chapter WhatsApp</label><br><label><input type="checkbox" id="in-app"> In-app notifications</label><button class="btn btn-primary" id="save-prefs" style="margin-top:1rem">Save Preferences</button></div></div></main><footer id="app-footer"></footer><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{renderNavbar('');renderFooter();if(!Auth.isLoggedIn()){location.href='/login.html';return;}const el=document.getElementById('notifications');try{const r=await API.get('/notifications');const a=r.notifications||[];el.innerHTML=a.length?a.map(n=>`<article class="auth-card" style="margin-bottom:1rem;opacity:${n.read?'.7':'1'}"><strong>${n.title}</strong><p style="margin:.4rem 0">${n.message}</p><small>${new Date(n.createdAt||n.created_at).toLocaleString()}</small>${!n.read?`<button class="btn btn-secondary btn-sm" data-id="${n.id}" style="margin-left:1rem">Mark read</button>`:''}</article>`).join(''):'<p style="color:var(--text-muted)">No notifications yet.</p>';el.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await API.request('/notifications/'+b.dataset.id+'/read',{method:'PATCH',headers:API.getHeaders(true)});location.reload()});const p=await API.get('/notifications/preferences');document.getElementById('wa-comic').checked=p.preferences.new_comic_whatsapp!==false;document.getElementById('wa-chapter').checked=p.preferences.new_chapter_whatsapp!==false;document.getElementById('in-app').checked=p.preferences.in_app_enabled!==false;}catch(e){el.innerHTML='<p>'+e.message+'</p>'}document.getElementById('save-prefs').onclick=async()=>{try{await API.put('/notifications/preferences',{new_comic_whatsapp:document.getElementById('wa-comic').checked,new_chapter_whatsapp:document.getElementById('wa-chapter').checked,in_app_enabled:document.getElementById('in-app').checked});showToast('Preferences saved.','success')}catch(e){showToast(e.message,'error')}}});
</script></body></html>
