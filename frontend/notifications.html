<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Center — Elder's Veil</title>
  <meta name="description" content="View system notifications, chapter updates, and manage notification preferences." />
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="container" style="padding-top:2rem;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:2rem;">
        <div>
          <h1 style="font-size:2rem; font-weight:900;"><i class="fas fa-bell text-gradient"></i> Notification Center</h1>
          <p style="color:var(--muted-text); font-size:0.92rem; margin-top:0.25rem;">Stay updated on comic releases, creator announcements, and account updates.</p>
        </div>

        <button class="btn btn-secondary btn-sm" id="mark-all-read-btn">
          <i class="fas fa-check-double"></i> Mark All as Read
        </button>
      </div>

      <div id="notifications-list-container" style="margin-bottom:3rem;">
        <div style="text-align:center; padding:3rem 1rem; color:var(--muted-text);">
          <i class="fas fa-circle-notch fa-spin" style="font-size:2rem; color:var(--primary);"></i>
        </div>
      </div>

      <!-- Notification Preferences -->
      <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:2rem; max-width:640px;">
        <h3 style="margin-bottom:1.25rem;"><i class="fas fa-sliders-h text-gradient"></i> Notification Preferences</h3>
        
        <div style="display:flex; flex-direction:column; gap:1rem;">
          <label style="display:flex; align-items:center; gap:0.75rem; font-size:0.95rem; color:var(--text); cursor:pointer;">
            <input type="checkbox" id="email-comic" style="width:18px; height:18px; accent-color:var(--primary);" />
            <span>Email me when new comics are published</span>
          </label>

          <label style="display:flex; align-items:center; gap:0.75rem; font-size:0.95rem; color:var(--text); cursor:pointer;">
            <input type="checkbox" id="email-chapter" style="width:18px; height:18px; accent-color:var(--primary);" />
            <span>Email me when new chapters of followed series drop</span>
          </label>

          <label style="display:flex; align-items:center; gap:0.75rem; font-size:0.95rem; color:var(--text); cursor:pointer;">
            <input type="checkbox" id="in-app" style="width:18px; height:18px; accent-color:var(--primary);" />
            <span>Enable in-app bell notifications</span>
          </label>
        </div>

        <button class="btn btn-primary" id="save-prefs" style="margin-top:1.5rem;">
          <i class="fas fa-save"></i> Save Notification Settings
        </button>
      </div>

    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar('notifications');
      renderFooter();

      if (!Auth.isLoggedIn()) {
        window.location.href = '/login.html';
        return;
      }

      const listEl = document.getElementById('notifications-list-container');

      const loadNotifications = async () => {
        try {
          const res = await API.get('/notifications');
          const notifications = res.notifications || [];
          if (notifications.length === 0) {
            listEl.innerHTML = renderEmptyState('fa-bell-slash', 'No Notifications', 'You are all caught up! No notifications right now.');
            return;
          }

          listEl.innerHTML = notifications.map(n => `
            <div style="background:var(--surface); border:1px solid var(--border); ${!n.read ? 'border-left:4px solid var(--primary);' : ''} border-radius:var(--radius-md); padding:1.25rem; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:flex-start; gap:1rem;">
              <div>
                <div style="font-weight:700; font-size:1rem; color:var(--text); margin-bottom:0.25rem;">${String(n.title).replace(/</g, '&lt;')}</div>
                <div style="font-size:0.9rem; color:var(--muted-text); line-height:1.5; margin-bottom:0.5rem;">${String(n.message).replace(/</g, '&lt;')}</div>
                <div style="font-size:0.78rem; color:var(--muted-text);"><i class="far fa-clock"></i> ${new Date(n.createdAt || n.created_at).toLocaleString()}</div>
              </div>
              ${!n.read ? `
                <button class="btn btn-secondary btn-sm mark-read-btn" data-id="${n.id}" style="white-space:nowrap;">
                  <i class="fas fa-check"></i> Mark Read
                </button>
              ` : ''}
            </div>
          `).join('');

          listEl.querySelectorAll('.mark-read-btn').forEach(btn => {
            btn.onclick = async () => {
              try {
                await API.request(`/notifications/${btn.dataset.id}/read`, { method: 'PATCH', headers: API.getHeaders(true) });
                showToast('Notification marked as read.', 'info');
                loadNotifications();
              } catch (e) { showToast(e.message, 'error'); }
            };
          });

        } catch (e) {
          listEl.innerHTML = renderEmptyState('fa-exclamation-triangle', 'Error', e.message);
        }
      };

      loadNotifications();

      // Mark All Read Button
      document.getElementById('mark-all-read-btn')?.addEventListener('click', async () => {
        try {
          const res = await API.get('/notifications');
          const notifications = res.notifications || [];
          for (const n of notifications) {
            if (!n.read) await API.request(`/notifications/${n.id}/read`, { method: 'PATCH', headers: API.getHeaders(true) });
          }
          showToast('All notifications marked as read.', 'success');
          loadNotifications();
        } catch (e) { showToast(e.message, 'error'); }
      });

      // Preferences
      try {
        const pRes = await API.get('/notifications/preferences');
        const p = pRes.preferences || {};
        document.getElementById('email-comic').checked = p.new_comic_email !== false;
        document.getElementById('email-chapter').checked = p.new_chapter_email !== false;
        document.getElementById('in-app').checked = p.in_app_enabled !== false;
      } catch (e) {}

      document.getElementById('save-prefs').onclick = async () => {
        try {
          await API.put('/notifications/preferences', {
            new_comic_email: document.getElementById('email-comic').checked,
            new_chapter_email: document.getElementById('email-chapter').checked,
            email_enabled: true,
            in_app_enabled: document.getElementById('in-app').checked
          });
          showToast('Notification preferences saved!', 'success');
        } catch (e) { showToast(e.message, 'error'); }
      };
    });
  </script>
</body>
</html>
