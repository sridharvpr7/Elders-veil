<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="api-base-url" content="https://elders-veil.onrender.com/api" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#7c3aed" />
  <title>Comics Management — Elder's Veil Admin</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../js/theme.js"></script>
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="container">
      <div class="section-title"><i class="fas fa-book text-gradient"></i> <span>Comic Content Management</span></div>

      <div class="admin-layout">
        <aside class="admin-sidebar">
          <a href="../admin/index.html" class="admin-nav-item"><i class="fas fa-chart-line"></i> Dashboard</a>
          <a href="../admin/comics.html" class="admin-nav-item active"><i class="fas fa-book"></i> Comics Management</a>
          <a href="../admin/chapters.html" class="admin-nav-item"><i class="fas fa-list-ol"></i> Chapters Management</a>
          <a href="../admin/upload.html" class="admin-nav-item"><i class="fas fa-cloud-upload-alt"></i> Upload Suite</a>
          <a href="../admin/users.html" class="admin-nav-item"><i class="fas fa-users"></i> Users Management</a>
          <a href="../admin/json-manager.html" class="admin-nav-item"><i class="fas fa-code"></i> JSON Import & Export</a>
        </aside>

        <div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h3>Database Comics List</h3>
            <a href="../admin/upload.html" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Add New Comic</a>
          </div>

          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Comic Title</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Chapters</th>
                  <th>Views</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="admin-comics-tbody">
                <tr><td colspan="6" style="text-align:center;">Loading database records...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/i18n.js"></script>
<script src="../js/components.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
