<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="api-base-url" content="https://elders-veil.onrender.com/api" />
  <meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="../manifest.json"><title>Admin Operations — Elder's Veil</title><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/theme.css"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/admin.css"><link rel="stylesheet" href="../css/responsive.css"><script src="../js/theme.js"></script></head><body><header id="app-header"></header><main><div class="container"><div class="section-title"><i class="fas fa-chart-pie"></i> Operations & Moderation</div><div class="admin-layout"><aside class="admin-sidebar"><a class="admin-nav-item" href="../admin/index.html">Dashboard</a><a class="admin-nav-item active" href="../admin/operations.html">Operations</a><a class="admin-nav-item" href="../admin/review.html">Review Queue</a><a class="admin-nav-item" href="../admin/users.html">Users</a></aside><div><section class="auth-card"><h3><i class="fas fa-chart-line"></i> Analytics (30 days)</h3><div id="analytics-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-bottom:1rem"></div><div id="analytics-bars"></div><button class="btn btn-secondary" id="backup">Create Manual Backup</button></section><section class="auth-card"><h3>Reports</h3><div id="reports">Loading...</div></section><section class="auth-card"><h3>Support Tickets</h3><div id="tickets">Loading...</div></section></div></div></div></main><footer id="app-footer"></footer><script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/i18n.js"></script>
<script src="../js/components.js"></script><script src="../js/pwa.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{renderNavbar('');renderFooter();if(!Auth.isAdmin())return location=sitePath('dashboard.html');const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));try{const x=await API.get('/admin/analytics?days=30');const cards=document.getElementById('analytics-cards');if(cards)cards.innerHTML=[['New users',x.newUsers],['New comics',x.newComics],['New chapters',x.newChapters],['Active premium',x.activePremiumUsers]].map(([k,v])=>`<div class="stat-card"><strong style="font-size:1.45rem">${Number(v||0).toLocaleString()}</strong><span>${k}</span></div>`).join('');const bars=document.getElementById('analytics-bars');const ev=(x.events||[]).slice(0,10);const max=Math.max(1,...ev.map(e=>Number(e.count||0)));if(bars)bars.innerHTML=ev.length?ev.map(e=>`<div style="margin:.65rem 0"><div style="display:flex;justify-content:space-between;gap:1rem;font-size:.85rem"><span>${esc(e.event_type)}</span><b>${Number(e.count||0).toLocaleString()}</b></div><div style="height:8px;background:var(--bg-tertiary);border-radius:999px;overflow:hidden"><div style="height:100%;width:${Math.round(Number(e.count||0)/max*100)}%;background:var(--grad-primary);border-radius:999px"></div></div></div>`).join(''):'<p style="color:var(--text-muted)">No analytics events recorded yet.</p>';}catch(e){const a=document.getElementById('analytics-cards');if(a)a.textContent=e.message;}try{const r=await API.get('/admin/reports');document.getElementById('reports').innerHTML=r.reports.length?r.reports.map(v=>`<div class="history-card"><b>${esc(v.target_type)}</b> — ${esc(v.reason)}<p>${esc(v.details||'')}</p><button class="btn btn-secondary btn-sm" data-report="${esc(v.id)}">Resolve</button></div>`).join(''):'No open reports.';document.querySelectorAll('[data-report]').forEach(b=>b.onclick=async()=>{await API.patch('/admin/reports/'+b.dataset.report,{status:'resolved',adminNote:'Reviewed by admin'});location.reload();});const t=await API.get('/admin/support');document.getElementById('tickets').innerHTML=t.tickets.length?t.tickets.map(v=>`<div class="history-card"><b>${esc(v.subject)}</b><p>${esc(v.message)}</p><span>${esc(v.status)}</span><button class="btn btn-secondary btn-sm" data-ticket="${esc(v.id)}">Resolve</button></div>`).join(''):'No tickets.';document.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=async()=>{await API.patch('/admin/support/'+b.dataset.ticket,{status:'resolved',adminReply:'Reviewed by admin'});location.reload();});}catch(e){document.getElementById('reports').textContent=e.message;}document.getElementById('backup').onclick=async()=>{try{const r=await API.post('/admin/backup',{});showToast(r.message,'success')}catch(e){showToast(e.message,'error')}}});</script></body></html>
