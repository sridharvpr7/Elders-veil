<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Review Queue — Elder's Veil Admin</title><link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="/js/theme.js"></script></head><body><header id="app-header"></header><main><div class="container"><div class="section-title"><i class="fas fa-inbox text-gradient"></i> Review Queue</div><div class="admin-layout"><aside class="admin-sidebar"><a href="/admin/index.html" class="admin-nav-item"><i class="fas fa-chart-line"></i> Dashboard</a><a href="/admin/review.html" class="admin-nav-item active"><i class="fas fa-inbox"></i> Review Queue</a><a href="/admin/comics.html" class="admin-nav-item"><i class="fas fa-book"></i> Comics Management</a><a href="/admin/chapters.html" class="admin-nav-item"><i class="fas fa-list-ol"></i> Chapters Management</a><a href="/admin/upload.html" class="admin-nav-item"><i class="fas fa-cloud-upload-alt"></i> Upload Suite</a><a href="/admin/users.html" class="admin-nav-item"><i class="fas fa-users"></i> Users Management</a><a href="/admin/json-manager.html" class="admin-nav-item"><i class="fas fa-code"></i> JSON Import & Export</a></aside><section><div class="review-toolbar"><div><h2>Creator Submissions</h2><p>Review the content before it appears publicly.</p></div><button class="btn btn-secondary btn-sm" id="refresh-review"><i class="fas fa-sync"></i> Refresh</button></div><div id="review-list">Loading review queue...</div></section></div></div></main><footer id="app-footer"></footer><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{renderNavbar('admin');renderFooter();if(!Auth.isLoggedIn()||!Auth.isAdmin()){location.href='/login.html';return;}const list=document.getElementById('review-list');async function load(){list.innerHTML='<div class="review-card">Loading...</div>';try{const r=await API.get('/admin/pending-submissions');const comics=(r.comics||[]).map(c=>({type:'comic',id:c.id,title:c.title,slug:c.slug,subtitle:`${c.type||'Comic'} • ${c.author||'Unknown author'} • By ${c.creatorUsername||'Unknown creator'}`,status:c.publishStatus,cover:c.coverImage,note:c.reviewNote}));const chapters=(r.chapters||[]).map(c=>({type:'chapter',id:c.id,title:`Chapter ${c.chapterNumber}: ${c.title||''}`,subtitle:`Chapter • ${c.pageCount||0} pages • By ${c.creatorUsername||'Unknown creator'}`,status:c.publishStatus,cover:null,note:c.reviewNote}));const items=[...comics,...chapters];if(!items.length){list.innerHTML='<div class="empty-review"><i class="fas fa-check-circle"></i><h3>Review queue is clear</h3><p>No creator submissions are waiting.</p></div>';return;}list.innerHTML=items.map(x=>`<article class="review-card"><div class="review-media">${x.cover?`<img src="${x.cover}" alt="">`:'<div class="review-placeholder"><i class="fas fa-file-alt"></i></div>'}</div><div class="review-content"><div class="review-meta"><span class="badge badge-purple">${x.type}</span><span class="status-chip status-${x.status}">${x.status}</span></div><h3>${x.title}</h3><p>${x.subtitle}</p>${x.note?`<p class="review-note"><i class="fas fa-comment"></i> ${x.note}</p>`:''}<div class="review-actions">${x.type==='comic'?`<a class="btn btn-secondary btn-sm" href="/comic.html?slug=${encodeURIComponent(x.slug||'')}" target="_blank"><i class="fas fa-eye"></i> Preview</a>`:`<a class="btn btn-secondary btn-sm" href="/reader.html?id=${x.id}" target="_blank"><i class="fas fa-book-open"></i> Preview</a>`}${x.status==='pending'?`<button class="btn btn-primary btn-sm approve" data-type="${x.type}" data-id="${x.id}"><i class="fas fa-check"></i> Approve & Publish</button><button class="btn btn-danger btn-sm reject" data-type="${x.type}" data-id="${x.id}"><i class="fas fa-times"></i> Reject</button>`:'<span style="color:var(--text-muted)">Previously reviewed</span>'}</div></div></article>`).join('');bind();}catch(e){list.innerHTML=`<div class="review-card" style="color:var(--accent-pink)">${e.message}</div>`}}function bind(){document.querySelectorAll('.approve').forEach(b=>b.onclick=async()=>{try{const base=b.dataset.type==='comic'?'/comics/':'/chapters/';await API.post(`${base}${b.dataset.id}/publish`,{});showToast('Approved and published.','success');load();}catch(e){showToast(e.message,'error')}});document.querySelectorAll('.reject').forEach(b=>b.onclick=async()=>{const reason=prompt('Rejection note for the creator (Cancel = keep pending):','Please update and resubmit.');if(reason===null)return;try{const base=b.dataset.type==='comic'?'/comics/':'/chapters/';await API.post(`${base}${b.dataset.id}/reject`,{reason});showToast('Submission rejected.','success');load();}catch(e){showToast(e.message,'error')}})}load();document.getElementById('refresh-review').onclick=load;});
</script></body></html>
