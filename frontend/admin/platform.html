<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Control — Elder's Veil</title><link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/platform.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><header id="app-header"></header><main><div class="container platform-wrap"><div class="platform-hero"><div><span class="eyebrow">ADMIN CONTROL</span><h1>Platform Control Center</h1><p>Analytics, moderation reports, audit history, homepage banners and Editor's Picks.</p></div></div><div id="stats" class="platform-grid"></div><div class="platform-grid" style="margin-top:1rem"><section class="platform-card"><h2>📢 Homepage Banner</h2><form id="banner"><input id="bt" placeholder="Title" required><input id="bi" placeholder="Image URL" required><input id="bl" placeholder="Link URL"><textarea id="bs" placeholder="Subtitle"></textarea><button class="btn btn-primary">Publish Banner</button></form></section><section class="platform-card"><h2>⭐ Editor's Pick</h2><form id="pick"><input id="pc" placeholder="Comic ID" required><input id="pn" placeholder="Note"><button class="btn btn-primary">Save Pick</button></form></section><section class="platform-card wide"><h2>🚩 Reports</h2><div id="reports"></div></section><section class="platform-card wide"><h2>📝 Audit Logs</h2><div id="audit"></div></section></div></div></main><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{renderNavbar('admin');if(!Auth.isAdmin()){location.href='/dashboard.html';return;}const $=x=>document.getElementById(x);async function load(){const [a,r,l]=await Promise.all([API.get('/platform/admin/analytics'),API.get('/platform/admin/reports'),API.get('/platform/admin/audit-logs')]);$('stats').innerHTML=[['New Users',a.newUsers],['New Comics',a.newComics],['New Chapters',a.newChapters],['Creator Follows',a.newCreatorFollows]].map(x=>`<section class="platform-card"><div class="muted">${x[0]}</div><strong style="font-size:2rem">${x[1]}</strong></section>`).join('');$('reports').innerHTML=(r.reports||[]).map(x=>`<div class="mini-item"><div><strong>${x.reason}</strong><div class="muted">${x.target_type}:${x.target_id||''} · ${x.reporter_username||'Reader'} · ${x.status}</div><div>${x.details||''}</div></div>${x.status==='open'?`<button class="btn btn-primary btn-sm resolve" data-id="${x.id}">Resolve</button>`:''}</div>`).join('')||'<span class="muted">No reports.</span>';$('audit').innerHTML=(l.logs||[]).slice(0,100).map(x=>`<div class="mini-item"><div><strong>${x.action}</strong><div class="muted">${x.username||x.actor_id||'System'} · ${new Date(x.created_at).toLocaleString()}</div></div><span class="muted">${x.target_type||''}</span></div>`).join('')||'<span class="muted">No audit events yet.</span>';document.querySelectorAll('.resolve').forEach(b=>b.onclick=async()=>{await API.request('/platform/admin/reports/'+b.dataset.id,{method:'PATCH',headers:API.getHeaders(true),body:JSON.stringify({status:'resolved'})});load()})}API.patch=async(e,b)=>API.request(e,{method:'PATCH',headers:API.getHeaders(true),body:JSON.stringify(b)});$('banner').onsubmit=async e=>{e.preventDefault();await API.post('/platform/admin/banners',{title:$('bt').value,imageUrl:$('bi').value,linkUrl:$('bl').value,subtitle:$('bs').value});showToast('Banner saved.');e.target.reset()};$('pick').onsubmit=async e=>{e.preventDefault();await API.post('/platform/admin/editor-picks',{comicId:$('pc').value,note:$('pn').value});showToast('Editor pick saved.');e.target.reset()};load();});
</script></body></html>
