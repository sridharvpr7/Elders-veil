<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community — Elder's Veil</title><link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="/css/platform.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><header id="app-header"></header><main><div class="container platform-wrap"><div class="platform-card"><div class="card-head"><h2>💬 Community</h2><a class="btn btn-secondary btn-sm" href="/comics.html">Back</a></div><div id="comic-title"></div><textarea id="comment" placeholder="Share your thoughts..." style="width:100%;min-height:100px"></textarea><label class="check"><input type="checkbox" id="spoiler"> Mark as spoiler</label><button class="btn btn-primary" id="post">Post Comment</button><div id="comments" style="margin-top:1.5rem"></div></div></div></main><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{renderNavbar();const id=new URLSearchParams(location.search).get('id');if(!id){location.href='/comics.html';return;}const $=x=>document.getElementById(x);async function load(){const r=await API.get('/platform/comics/'+encodeURIComponent(id)+'/comments');$('comments').innerHTML=(r.comments||[]).map(c=>`<article class="platform-card" style="margin:.75rem 0;min-height:0"><strong>${c.username||'Reader'}</strong><span class="muted"> · ${new Date(c.created_at).toLocaleString()}</span><p style="margin:.7rem 0">${c.is_spoiler?'<strong>⚠ Spoiler</strong> ':''}${c.body}</p><button class="btn btn-secondary btn-sm like-comment" data-id="${c.id}"><i class="fas fa-heart"></i> ${c.likes||0}</button><button class="btn btn-secondary btn-sm reply" data-id="${c.id}">Reply</button></article>`).join('')||'<p class="muted">Be the first to comment.</p>';document.querySelectorAll('.like-comment').forEach(b=>b.onclick=async()=>{await API.post('/platform/comments/'+b.dataset.id+'/like',{});load()});document.querySelectorAll('.reply').forEach(b=>b.onclick=async()=>{const body=prompt('Reply:');if(body){await API.post('/platform/comics/'+id+'/comments',{body,parentId:b.dataset.id});load()}})}$('post').onclick=async()=>{if(!Auth.isLoggedIn()){location.href='/login.html';return;}const body=$('comment').value.trim();if(!body)return;await API.post('/platform/comics/'+id+'/comments',{body,spoiler:$('spoiler').checked});$('comment').value='';$('spoiler').checked=false;load()};load();});
</script></body></html>
