<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Verify Email — Elder's Veil</title><link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/navbar.css"><link rel="stylesheet" href="/css/auth.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="/js/theme.js"></script></head><body><header id="app-header"></header><main><div class="auth-wrapper"><div class="auth-card"><div class="auth-header"><h1 class="auth-title">Verify Your Email</h1><p class="auth-subtitle">Enter the 6-digit code sent to your email.</p></div><form id="verify-form"><div class="form-group"><label class="form-label">Verification Code</label><input id="otp" class="form-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required placeholder="123456"></div><button class="btn btn-primary" style="width:100%;margin-top:1rem"><i class="fas fa-check-circle"></i> Verify Email</button></form><button id="resend" class="btn btn-secondary" style="width:100%;margin-top:.75rem">Resend Code</button><div class="auth-footer"><a href="/login.html">Back to Sign In</a></div></div></div></main><footer id="app-footer"></footer><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/components.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{renderNavbar('');renderFooter();const email=sessionStorage.getItem('pendingVerificationEmail')||'';if(!email){location.href='/register.html';return;}document.getElementById('verify-form').onsubmit=async e=>{e.preventDefault();try{const r=await API.post('/auth/verify-email-otp',{email,otp:document.getElementById('otp').value.trim()});Auth.saveSession(r.user,r.token);sessionStorage.removeItem('pendingVerificationEmail');showToast(r.message||'Email verified!','success');setTimeout(()=>location.href=r.user.role==='admin'?'/admin/index.html':'/dashboard.html',500)}catch(err){showToast(err.message,'error')}};document.getElementById('resend').onclick=async()=>{try{const r=await API.post('/auth/resend-email-otp',{email});showToast(r.message,'success')}catch(err){showToast(err.message,'error')}}});</script></body></html>
