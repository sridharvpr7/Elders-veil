<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - Admin Console</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="ri-book-3-fill"></i></div>
        <span>ComicVerse <span style="font-size:0.75rem; color:var(--warning); font-weight:700;">ADMIN</span></span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link"><i class="ri-home-4-line"></i> Main Platform</a>
      </nav>

      <div class="header-actions">
        <button class="btn-icon-only theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="ri-sun-line"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="admin.html" class="admin-nav-item"><i class="ri-dashboard-line"></i> Dashboard Overview</a>
      <a href="admin-comics.html" class="admin-nav-item"><i class="ri-book-3-line"></i> Manage Comics</a>
      <a href="admin-chapters.html" class="admin-nav-item"><i class="ri-list-check-2"></i> Manage Chapters</a>
      <a href="admin-users.html" class="admin-nav-item active"><i class="ri-user-settings-line"></i> Manage Users</a>
    </aside>

    <main class="admin-content-area">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem;">User Accounts Administration</h1>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">View registered platform accounts and manage user roles.</p>
      </div>

      <div style="background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-users-table-body">
            <tr>
              <td>System Admin</td>
              <td>@admin</td>
              <td>admin@comicverse.com</td>
              <td><span class="badge" style="background:var(--warning); color:#000;">ADMIN</span></td>
              <td><span class="badge badge-status-ongoing">Active</span></td>
              <td><button class="btn btn-secondary" style="padding:0.25rem 0.6rem; font-size:0.78rem;" disabled>System Account</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('admin-users-table-body');
      const users = Auth.getUsers();
      if (users.length > 0 && tbody) {
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${u.displayName}</td>
            <td>@${u.username}</td>
            <td>${u.email}</td>
            <td><span class="badge" style="${u.role === 'admin' ? 'background:var(--warning); color:#000;' : 'background:var(--accent-light); color:var(--accent);'}">${u.role || 'user'}</span></td>
            <td><span class="badge badge-status-ongoing">Active</span></td>
            <td><button class="btn btn-secondary" style="padding:0.25rem 0.6rem; font-size:0.78rem;" onclick="UI.showToast('User status modified', 'info')">Manage</button></td>
          </tr>
        `).join('');
      }
    });
  </script>
</body>
</html>
