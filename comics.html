<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comics Library - ComicVerse</title>
  <meta name="description" content="Explore and filter our complete collection of webcomics, manga, and manhwa by genre, status, rating, and publication year.">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="ri-book-3-fill"></i></div>
        <span>ComicVerse</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link"><i class="ri-home-4-line"></i> Home</a>
        <a href="comics.html" class="nav-link active"><i class="ri-compass-3-line"></i> Comics Library</a>
        <a href="favorites.html" class="nav-link"><i class="ri-heart-line"></i> Favorites</a>
        <a href="history.html" class="nav-link"><i class="ri-history-line"></i> History</a>
      </nav>

      <div class="header-actions">
        <div class="search-wrapper">
          <i class="ri-search-line search-icon-btn"></i>
          <input type="text" class="search-input-box" placeholder="Search comics..." aria-label="Search comics">
          <div class="search-results-popover"></div>
        </div>

        <button class="btn-icon-only theme-toggle-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
          <i class="ri-sun-line"></i>
        </button>

        <button class="btn-icon-only mobile-menu-btn" style="display: none;" title="Toggle Navigation Menu" aria-label="Toggle Navigation Menu">
          <i class="ri-menu-line"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <!-- Catalog Page Title -->
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2.2rem;">Comics Library</h1>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">Browse and filter through our extensive JSON-powered webcomic directory.</p>
      </div>

      <!-- Filters & Search Toolbar Box -->
      <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 2.5rem; box-shadow: var(--shadow-md);">
        
        <!-- Search input inside catalog -->
        <div style="margin-bottom: 1.25rem; position: relative;">
          <i class="ri-search-line" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.1rem;"></i>
          <input type="text" id="catalog-search-input" style="width: 100%; padding: 0.75rem 1rem 0.75rem 2.8rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary);" placeholder="Search by title, author, artist, or tags...">
        </div>

        <!-- Genre Pill Buttons Bar -->
        <div style="margin-bottom: 1.25rem;">
          <label style="font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; display: block; margin-bottom: 0.6rem;">Categories &amp; Genres</label>
          <div id="genre-filter-buttons" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
        </div>

        <!-- Dropdown Filters Row -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
          <div>
            <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 0.35rem;">Status</label>
            <select id="filter-status" style="width: 100%; padding: 0.55rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
              <option value="all">All Status</option>
              <option value="ongoing">Ongoing</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <div>
            <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 0.35rem;">Comic Type</label>
            <select id="filter-type" style="width: 100%; padding: 0.55rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
              <option value="all">All Types</option>
              <option value="webcomic">Webcomic</option>
              <option value="manhwa">Manhwa</option>
              <option value="webtoon">Webtoon</option>
              <option value="manga">Manga</option>
            </select>
          </div>

          <div>
            <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 0.35rem;">Sort Order</label>
            <select id="sort-by" style="width: 100%; padding: 0.55rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
              <option value="latest">Latest Released</option>
              <option value="oldest">Oldest Released</option>
              <option value="popular">Most Popular</option>
              <option value="rating">Highest Rated</option>
              <option value="az">A-Z Title</option>
              <option value="za">Z-A Title</option>
            </select>
          </div>
        </div>

      </div>

      <!-- Results Count Status Bar -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <span id="results-count" style="font-weight: 600; color: var(--text-secondary); font-size: 0.95rem;">Loading catalog...</span>
      </div>

      <!-- Comic Grid Results -->
      <div class="comics-grid" id="catalog-comics-grid"></div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 ComicVerse Platform. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
  <script src="js/comics.js"></script>
</body>
</html>
