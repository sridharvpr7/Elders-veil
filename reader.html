<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Reader - ComicVerse</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/reader.css">
</head>
<body class="reader-body">

  <!-- Reader Fixed Top Header -->
  <header class="reader-header">
    <div class="reader-title-info">
      <a href="javascript:history.back()" class="btn-icon-only" title="Exit Reader" aria-label="Exit Reader">
        <i class="ri-arrow-left-line"></i>
      </a>
      <div>
        <span class="reader-comic-name" id="reader-comic-title">Loading...</span>
        <span class="reader-chapter-name" id="reader-chapter-title"></span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <button class="btn-icon-only theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
        <i class="ri-sun-line"></i>
      </button>
      <button class="btn-icon-only" id="reader-shortcuts-btn" title="Keyboard Shortcuts (?)" aria-label="Keyboard Shortcuts">
        <i class="ri-question-mark"></i>
      </button>
    </div>
  </header>

  <!-- Top Scroll Reading Progress Line -->
  <div class="reader-progress-track">
    <div class="reader-progress-fill" id="reader-progress-fill"></div>
  </div>

  <!-- Reader Main Image Canvas Container -->
  <main class="reader-container fit-width">
    <div class="reader-pages-wrap" id="reader-pages-container">
      <div style="padding: 4rem; text-align: center; color: var(--text-muted);">
        <i class="ri-loader-4-line spin" style="font-size: 2.5rem; display: block; margin-bottom: 1rem;"></i>
        Loading comic pages...
      </div>
    </div>
  </main>

  <!-- Floating Reader Toolbar -->
  <div class="reader-toolbar">
    <button class="btn-icon-only" id="reader-prev-chapter-btn" title="Previous Chapter" aria-label="Previous Chapter">
      <i class="ri-skip-back-line"></i>
    </button>

    <select class="reader-chapter-select" id="reader-chapter-select" aria-label="Chapter Select"></select>

    <button class="btn-icon-only" id="reader-next-chapter-btn" title="Next Chapter" aria-label="Next Chapter">
      <i class="ri-skip-forward-line"></i>
    </button>

    <div class="toolbar-divider"></div>

    <span class="reader-page-counter" id="reader-page-counter">Page 1 / 1</span>

    <div class="toolbar-divider"></div>

    <button class="btn-icon-only" id="reader-fit-width-btn" title="Toggle Fit Screen / Fit Width" aria-label="Toggle Zoom">
      <i class="ri-aspect-ratio-line"></i>
    </button>

    <button class="btn-icon-only" id="reader-fullscreen-btn" title="Toggle Fullscreen (F)" aria-label="Toggle Fullscreen">
      <i class="ri-fullscreen-line"></i>
    </button>
  </div>

  <!-- Keyboard Shortcuts Modal -->
  <div class="keyboard-shortcuts-modal" id="shortcuts-modal">
    <div class="shortcuts-box">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <h3 style="margin: 0;"><i class="ri-keyboard-line" style="color: var(--accent);"></i> Keyboard Shortcuts</h3>
        <button class="btn-icon-only" id="close-shortcuts-btn" style="width: 32px; height: 32px;" aria-label="Close Modal"><i class="ri-close-line"></i></button>
      </div>

      <div class="shortcut-row">
        <span>Next Page / Scroll Down</span>
        <div><kbd>→</kbd> or <kbd>Down</kbd> or <kbd>Space</kbd></div>
      </div>
      <div class="shortcut-row">
        <span>Previous Page / Scroll Up</span>
        <div><kbd>←</kbd> or <kbd>Up</kbd></div>
      </div>
      <div class="shortcut-row">
        <span>Toggle Fullscreen</span>
        <div><kbd>F</kbd></div>
      </div>
      <div class="shortcut-row">
        <span>Close Modal / Exit Fullscreen</span>
        <div><kbd>Esc</kbd></div>
      </div>
      <div class="shortcut-row">
        <span>Toggle Shortcuts Help</span>
        <div><kbd>?</kbd></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
