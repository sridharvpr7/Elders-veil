<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Chapters - Admin Console</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="ri-book-3-fill"></i></div>
        <span>ComicVerse <span style="font-size:0.75rem; color:var(--warning); font-weight:700;">ADMIN</span></span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link"><i class="ri-home-4-line"></i> Main Platform</a>
      </nav>

      <div class="header-actions">
        <button class="btn-icon-only theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="ri-sun-line"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="admin.html" class="admin-nav-item"><i class="ri-dashboard-line"></i> Dashboard Overview</a>
      <a href="admin-comics.html" class="admin-nav-item"><i class="ri-book-3-line"></i> Manage Comics</a>
      <a href="admin-chapters.html" class="admin-nav-item active"><i class="ri-list-check-2"></i> Manage Chapters</a>
      <a href="admin-users.html" class="admin-nav-item"><i class="ri-user-settings-line"></i> Manage Users</a>
    </aside>

    <main class="admin-content-area">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem;">Chapter Management &amp; Page Uploads</h1>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">Upload webcomic page image strips and create chapter numbers.</p>
      </div>

      <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 2rem;">
        <h3 style="margin-bottom: 1.5rem;"><i class="ri-upload-cloud-line" style="color: var(--accent);"></i> Add New Chapter</h3>
        <form id="admin-add-chapter-form">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem;">
            <div>
              <label class="form-label">Select Comic</label>
              <select id="adm-ch-comic" style="width:100%; padding:0.6rem; background:var(--bg-secondary); border:1px solid var(--border); border-radius:6px; color:#fff;">
                <option value="comic-001">Solo Leveling: Shadow Monarch</option>
                <option value="comic-002">Cyberpunk Neon Samurai</option>
                <option value="comic-003">Celestial Magic Academy</option>
              </select>
            </div>
            <div>
              <label class="form-label">Chapter Number</label>
              <input type="number" id="adm-ch-number" class="search-input-box" style="width:100%; border-radius:6px;" value="4" required>
            </div>
            <div>
              <label class="form-label">Chapter Title</label>
              <input type="text" id="adm-ch-title" class="search-input-box" style="width:100%; border-radius:6px;" placeholder="e.g. Awakening the Shadows" required>
            </div>
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label class="form-label">Upload Chapter Pages (Multi-select Images)</label>
            <input type="file" multiple accept="image/*" style="width:100%; padding:0.75rem; background:var(--bg-secondary); border:1px solid var(--border); border-radius:6px; color:#fff;">
          </div>

          <button type="submit" class="btn btn-primary"><i class="ri-upload-line"></i> Publish Chapter</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.getElementById('admin-add-chapter-form').addEventListener('submit', (e) => {
      e.preventDefault();
      UI.showToast('Chapter published successfully to database!', 'success');
    });
  </script>
</body>
</html>
