<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Comics - Admin Console</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="ri-book-3-fill"></i></div>
        <span>ComicVerse <span style="font-size:0.75rem; color:var(--warning); font-weight:700;">ADMIN</span></span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link"><i class="ri-home-4-line"></i> Main Platform</a>
      </nav>

      <div class="header-actions">
        <button class="btn-icon-only theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="ri-sun-line"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="admin.html" class="admin-nav-item"><i class="ri-dashboard-line"></i> Dashboard Overview</a>
      <a href="admin-comics.html" class="admin-nav-item active"><i class="ri-book-3-line"></i> Manage Comics</a>
      <a href="admin-chapters.html" class="admin-nav-item"><i class="ri-list-check-2"></i> Manage Chapters</a>
      <a href="admin-users.html" class="admin-nav-item"><i class="ri-user-settings-line"></i> Manage Users</a>
    </aside>

    <main class="admin-content-area">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
        <div>
          <h1 style="font-size: 2rem;">Comic Management</h1>
          <p style="color: var(--text-secondary); margin-top: 0.25rem;">Create, update, and publish comic titles to the database catalog.</p>
        </div>
      </div>

      <!-- Add New Comic Form Card -->
      <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 2rem; margin-bottom: 2.5rem;">
        <h3 style="margin-bottom: 1.5rem;"><i class="ri-add-circle-line" style="color: var(--accent);"></i> Add New Comic Entry</h3>
        
        <form id="admin-add-comic-form">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem;">
            <div>
              <label class="form-label">Comic Title</label>
              <input type="text" id="adm-title" class="search-input-box" style="width:100%; border-radius:6px;" required placeholder="e.g. Solo Leveling 2">
            </div>
            <div>
              <label class="form-label">Author Name</label>
              <input type="text" id="adm-author" class="search-input-box" style="width:100%; border-radius:6px;" required placeholder="e.g. Chugong">
            </div>
            <div>
              <label class="form-label">Artist Name</label>
              <input type="text" id="adm-artist" class="search-input-box" style="width:100%; border-radius:6px;" required placeholder="e.g. REDICE Studio">
            </div>
            <div>
              <label class="form-label">Primary Genre</label>
              <select id="adm-genre" style="width:100%; padding:0.6rem; background:var(--bg-secondary); border:1px solid var(--border); border-radius:6px; color:#fff;">
                <option value="Action">Action</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Romance">Romance</option>
              </select>
            </div>
            <div>
              <label class="form-label">Type</label>
              <select id="adm-type" style="width:100%; padding:0.6rem; background:var(--bg-secondary); border:1px solid var(--border); border-radius:6px; color:#fff;">
                <option value="manhwa">Manhwa</option>
                <option value="webcomic">Webcomic</option>
                <option value="manga">Manga</option>
                <option value="webtoon">Webtoon</option>
              </select>
            </div>
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label class="form-label">Comic Description / Synopsis</label>
            <textarea id="adm-description" rows="3" style="width:100%; padding:0.75rem; background:var(--bg-secondary); border:1px solid var(--border); border-radius:6px; color:#fff;" placeholder="Detailed synopsis..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary"><i class="ri-check-line"></i> Save Comic Entry</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
