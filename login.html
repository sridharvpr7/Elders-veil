<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ComicVerse</title>
  <meta name="description" content="Sign in to your ComicVerse user account to access synced bookmarks, reading history, and personalized preferences.">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page-body">

  <!-- Full-Screen Cinematic Web Background -->
  <div class="auth-bg-layer">
    <div class="auth-bg-grid"></div>
  </div>

  <div class="auth-card-wrapper">
    <div class="auth-card fade-in">
      
      <!-- Brand Header -->
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <div class="logo-icon"><i class="ri-book-3-fill"></i></div>
          <span>ComicVerse</span>
        </a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to resume reading your favorite webcomics</p>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        
        <div class="form-group">
          <label class="form-label" for="login-identifier">Username or Email</label>
          <div class="form-input-wrap">
            <i class="ri-user-line input-icon-left"></i>
            <input type="text" id="login-identifier" class="form-input" placeholder="Enter username or email" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" for="login-password" style="margin:0;">Password</label>
            <a href="#" id="forgot-password-link" style="font-size: 0.78rem; color: var(--accent);">Forgot password?</a>
          </div>
          <div class="form-input-wrap">
            <i class="ri-lock-password-line input-icon-left"></i>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <i class="ri-eye-off-line password-toggle-btn" id="toggle-password-btn" title="Show/Hide Password"></i>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" id="login-remember-me" style="accent-color: var(--accent);"> Remember me
          </label>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn">
          <i class="ri-login-box-line"></i> Sign In to Account
        </button>

      </form>

      <!-- Footer & Guest Actions -->
      <div class="auth-footer-links">
        Don't have an account? <a href="register.html">Create Account</a>
        <a href="index.html" class="guest-continue-btn"><i class="ri-arrow-right-line"></i> Continue as Guest</a>
      </div>

    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const passInput = document.getElementById('login-password');
      const togglePassBtn = document.getElementById('toggle-password-btn');
      const forgotPassLink = document.getElementById('forgot-password-link');

      // Password Visibility Toggle
      if (togglePassBtn && passInput) {
        togglePassBtn.addEventListener('click', () => {
          const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passInput.setAttribute('type', type);
          togglePassBtn.className = type === 'password' ? 'ri-eye-off-line password-toggle-btn' : 'ri-eye-line password-toggle-btn';
        });
      }

      // Forgot Password Toast
      if (forgotPassLink) {
        forgotPassLink.addEventListener('click', (e) => {
          e.preventDefault();
          UI.showToast('Password recovery option is available via profile security settings or support.', 'info');
        });
      }

      // Handle Form Submission
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const identifier = document.getElementById('login-identifier').value.trim();
          const password = passInput.value;
          const rememberMe = document.getElementById('login-remember-me').checked;

          try {
            const user = await Auth.loginUser(identifier, password, rememberMe);
            UI.showToast(`Welcome back, ${user.displayName}!`, 'success');
            setTimeout(() => window.location.href = 'index.html', 800);
          } catch (err) {
            UI.showToast(err.message, 'error');
          }
        });
      }
    });
  </script>
</body>
</html>
