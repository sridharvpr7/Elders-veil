<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
    <rect width="800" height="1200" fill="#0d0d12" />
    
    <!-- Panel 1 -->
    <rect x="30" y="40" width="740" height="340" rx="12" fill="#31103f" stroke="#27273a" stroke-width="4"/>
    <text x="70" y="90" font-family="'Outfit', sans-serif" font-size="24" font-weight="bold" fill="#ffffff">HEARTBEATS</text>
    <text x="70" y="125" font-family="sans-serif" font-size="16" fill="#e879f9">CHAPTER 3 - PAGE 3</text>
    <circle cx="640" cy="200" r="70" fill="#f472b6" opacity="0.3"/>
    <text x="640" y="225" font-size="64" text-anchor="middle">🌙</text>

    <!-- Comic Speech Bubble -->
    <rect x="70" y="180" width="380" height="120" rx="18" fill="#ffffff" />
    <polygon points="120,300 140,300 110,325" fill="#ffffff"/>
    <text x="95" y="225" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f172a">"Step into the threshold, Jinwoo..."</text>
    <text x="95" y="255" font-family="sans-serif" font-size="14" fill="#475569">The system screen blinks softly.</text>

    <!-- Panel 2 -->
    <rect x="30" y="410" width="355" height="420" rx="12" fill="#f472b6" opacity="0.15" stroke="#27273a" stroke-width="4"/>
    <text x="207" y="620" font-size="80" text-anchor="middle">🌙</text>
    <text x="207" y="720" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">PANEL 3.A</text>

    <!-- Panel 3 -->
    <rect x="415" y="410" width="355" height="420" rx="12" fill="#31103f" stroke="#27273a" stroke-width="4"/>
    <rect x="440" y="440" width="305" height="80" rx="14" fill="#ffffff"/>
    <text x="460" y="485" font-family="sans-serif" font-weight="bold" font-size="15" fill="#0f172a">"Is this the power of leveling up?!"</text>
    <circle cx="592" cy="640" r="75" fill="#e879f9" opacity="0.4"/>
    <text x="592" y="665" font-size="64" text-anchor="middle">⚡</text>

    <!-- Panel 4 Action Splash -->
    <rect x="30" y="860" width="740" height="290" rx="12" fill="url(#splash_grad_comic-005_3)" stroke="#e879f9" stroke-width="3"/>
    <defs>
      <linearGradient id="splash_grad_comic-005_3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#31103f;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#e879f9;stop-opacity:0.6" />
      </linearGradient>
    </defs>
    <text x="400" y="980" font-family="'Outfit', sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" font-style="italic">BOOM!!</text>
    <text x="400" y="1030" font-family="sans-serif" font-size="16" fill="#e879f9" text-anchor="middle">To be continued on next page...</text>
    
    <!-- Footer Page Number -->
    <text x="760" y="1180" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="end">Page 3</text>
  </svg>