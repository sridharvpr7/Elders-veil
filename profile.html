<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - ComicVerse</title>
  <meta name="description" content="View and manage your ComicVerse reader profile, bio, display name, and avatar settings.">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="ri-book-3-fill"></i></div>
        <span>ComicVerse</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link"><i class="ri-home-4-line"></i> Home</a>
        <a href="comics.html" class="nav-link"><i class="ri-compass-3-line"></i> Comics Library</a>
        <a href="favorites.html" class="nav-link"><i class="ri-heart-line"></i> Favorites</a>
        <a href="history.html" class="nav-link"><i class="ri-history-line"></i> History</a>
      </nav>

      <div class="header-actions">
        <div class="search-wrapper">
          <i class="ri-search-line search-icon-btn"></i>
          <input type="text" class="search-input-box" placeholder="Search comics..." aria-label="Search comics">
          <div class="search-results-popover"></div>
        </div>

        <button class="btn-icon-only theme-toggle-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
          <i class="ri-sun-line"></i>
        </button>

        <button class="btn-icon-only mobile-menu-btn" style="display: none;" title="Toggle Navigation Menu" aria-label="Toggle Navigation Menu">
          <i class="ri-menu-line"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <!-- Profile Header Visual Card (Rendered via profile.js) -->
      <section id="profile-card-container" style="margin-bottom: 3rem;">
        <div class="skeleton skeleton-card" style="height: 220px; border-radius: 20px;"></div>
      </section>

      <!-- Edit Profile Section -->
      <section style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: var(--shadow-md);">
        
        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem;">
          <i class="ri-edit-box-line" style="font-size: 1.6rem; color: var(--accent);"></i>
          <h2 style="font-size: 1.5rem; margin: 0;">Edit Profile Information</h2>
        </div>

        <form id="edit-profile-form">
          
          <div style="display: grid; grid-template-columns: 140px 1fr; gap: 2rem; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap;">
            
            <!-- Avatar Upload & Preview Box -->
            <div style="text-align: center;">
              <img src="assets/images/avatars/default.svg" id="avatar-preview-img" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 0.75rem;" alt="Avatar Preview">
              <label class="btn btn-secondary" style="padding: 0.45rem 0.8rem; font-size: 0.82rem; cursor: pointer; display: inline-flex;">
                <i class="ri-upload-2-line"></i> Change Avatar
                <input type="file" id="avatar-file-input" accept="image/*" style="display: none;">
              </label>
            </div>

            <!-- Profile Fields -->
            <div style="display: flex; flex-direction: column; gap: 1.25rem;">
              
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                  <label class="form-label" for="edit-display-name">Display Name</label>
                  <input type="text" id="edit-display-name" class="search-input-box" style="width: 100%; border-radius: var(--radius-md);" required>
                </div>

                <div>
                  <label class="form-label" for="edit-username">Username</label>
                  <input type="text" id="edit-username" class="search-input-box" style="width: 100%; border-radius: var(--radius-md);" required>
                </div>
              </div>

              <div>
                <label class="form-label" for="edit-bio">User Bio / About Me</label>
                <textarea id="edit-bio" rows="4" style="width: 100%; padding: 0.85rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); resize: vertical;" placeholder="Write a short bio about your favorite webcomic genres..."></textarea>
              </div>

            </div>

          </div>

          <div style="display: flex; justify-content: flex-end; gap: 1rem;">
            <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem;">
              <i class="ri-save-line"></i> Save Profile Changes
            </button>
          </div>

        </form>

      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 ComicVerse Platform. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
