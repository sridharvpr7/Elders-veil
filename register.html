<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ComicVerse</title>
  <meta name="description" content="Create a free ComicVerse account to bookmark webcomics, track chapter reading progress, and customize your reader preferences.">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page-body">

  <div class="auth-bg-layer">
    <div class="auth-bg-grid"></div>
  </div>

  <div class="auth-card-wrapper" style="max-width: 520px; padding: 2rem 1rem;">
    <div class="auth-card fade-in">
      
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <div class="logo-icon"><i class="ri-book-3-fill"></i></div>
          <span>ComicVerse</span>
        </a>
        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Join thousands of comic readers today</p>
      </div>

      <form id="register-form">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-display-name">Display Name</label>
            <div class="form-input-wrap">
              <i class="ri-user-smile-line input-icon-left"></i>
              <input type="text" id="reg-display-name" class="form-input" placeholder="e.g. Jinwoo Sung" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-username">Username</label>
            <div class="form-input-wrap">
              <i class="ri-at-line input-icon-left"></i>
              <input type="text" id="reg-username" class="form-input" placeholder="jinwoo_s" required autocomplete="username">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <div class="form-input-wrap">
            <i class="ri-mail-line input-icon-left"></i>
            <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="form-input-wrap">
              <i class="ri-lock-password-line input-icon-left"></i>
              <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
              <i class="ri-eye-off-line password-toggle-btn" id="toggle-reg-pass-btn"></i>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <div class="form-input-wrap">
              <i class="ri-lock-check-line input-icon-left"></i>
              <input type="password" id="reg-confirm-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
            </div>
          </div>
        </div>

        <!-- Real-Time Password Strength Meter -->
        <div class="strength-meter-wrap" style="margin-bottom: 1.25rem;">
          <div class="strength-bar-track">
            <div class="strength-bar-fill" id="strength-bar-fill"></div>
          </div>
          <span class="strength-label" id="strength-label">Password Strength: Enter password</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-dob">Date of Birth</label>
          <div class="form-input-wrap">
            <i class="ri-calendar-line input-icon-left"></i>
            <input type="date" id="reg-dob" class="form-input">
          </div>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" id="reg-terms" style="margin-top: 3px; accent-color: var(--accent);" required>
            <span>I agree to the <a href="#" style="color: var(--accent);">Terms of Service</a> and <a href="#" style="color: var(--accent);">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn">
          <i class="ri-user-add-line"></i> Create My Account
        </button>

      </form>

      <div class="auth-footer-links">
        Already have an account? <a href="login.html">Sign In</a>
      </div>

    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const registerForm = document.getElementById('register-form');
      const passInput = document.getElementById('reg-password');
      const togglePassBtn = document.getElementById('toggle-reg-pass-btn');
      const strengthFill = document.getElementById('strength-bar-fill');
      const strengthLabel = document.getElementById('strength-label');

      // Password Visibility Toggle
      if (togglePassBtn && passInput) {
        togglePassBtn.addEventListener('click', () => {
          const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passInput.setAttribute('type', type);
          togglePassBtn.className = type === 'password' ? 'ri-eye-off-line password-toggle-btn' : 'ri-eye-line password-toggle-btn';
        });
      }

      // Real-Time Password Strength Meter Update
      if (passInput && strengthFill && strengthLabel) {
        passInput.addEventListener('input', (e) => {
          const val = e.target.value;
          const strength = Auth.evaluatePasswordStrength(val);
          
          const percentMap = [0, 25, 50, 75, 100];
          const pct = percentMap[strength.score] || 0;
          
          strengthFill.style.width = `${pct}%`;
          strengthFill.style.backgroundColor = strength.color;
          strengthLabel.textContent = `Password Strength: ${strength.label}`;
          strengthLabel.style.color = strength.color;
        });
      }

      // Handle Form Submit
      if (registerForm) {
        registerForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const displayName = document.getElementById('reg-display-name').value;
          const username = document.getElementById('reg-username').value;
          const email = document.getElementById('reg-email').value;
          const password = passInput.value;
          const confirmPassword = document.getElementById('reg-confirm-password').value;
          const dateOfBirth = document.getElementById('reg-dob').value;
          const termsAccepted = document.getElementById('reg-terms').checked;

          try {
            const user = await Auth.registerUser({
              displayName, username, email, password, confirmPassword, dateOfBirth, termsAccepted
            });

            UI.showToast(`Account created! Welcome to ComicVerse, ${user.displayName}!`, 'success');
            setTimeout(() => window.location.href = 'index.html', 1000);
          } catch (err) {
            UI.showToast(err.message, 'error');
          }
        });
      }
    });
  </script>
</body>
</html>
