<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Details - ComicVerse</title>
  <meta name="description" content="View comic details, summary, authors, ratings, tags, and complete chapter directory list.">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon"><i class="ri-book-3-fill"></i></div>
        <span>ComicVerse</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link"><i class="ri-home-4-line"></i> Home</a>
        <a href="comics.html" class="nav-link"><i class="ri-compass-3-line"></i> Comics Library</a>
        <a href="favorites.html" class="nav-link"><i class="ri-heart-line"></i> Favorites</a>
        <a href="history.html" class="nav-link"><i class="ri-history-line"></i> History</a>
      </nav>

      <div class="header-actions">
        <div class="search-wrapper">
          <i class="ri-search-line search-icon-btn"></i>
          <input type="text" class="search-input-box" placeholder="Search comics..." aria-label="Search comics">
          <div class="search-results-popover"></div>
        </div>

        <button class="btn-icon-only theme-toggle-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
          <i class="ri-sun-line"></i>
        </button>

        <button class="btn-icon-only mobile-menu-btn" style="display: none;" title="Toggle Navigation Menu" aria-label="Toggle Navigation Menu">
          <i class="ri-menu-line"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <!-- Comic Details Header Section (Rendered via JS) -->
      <section id="comic-details-container">
        <div class="skeleton skeleton-card" style="height: 380px; border-radius: 20px;"></div>
      </section>

      <!-- Chapter Directory Section -->
      <section style="margin-top: 3rem;">
        <div class="section-header">
          <div class="section-title">
            <i class="ri-list-check-2"></i>
            <h2>Chapter Directory</h2>
          </div>
        </div>
        <div id="chapters-list-container">
          <div class="skeleton skeleton-card" style="height: 80px; margin-bottom: 1rem;"></div>
          <div class="skeleton skeleton-card" style="height: 80px; margin-bottom: 1rem;"></div>
          <div class="skeleton skeleton-card" style="height: 80px;"></div>
        </div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 ComicVerse Platform. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
  <script src="js/comic-details.js"></script>
</body>
</html>
